<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>两位数乘除一位数 - PK对战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none;color:#fff}

/* ===== 主菜单 ===== */
.menu-screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;background:linear-gradient(180deg,#0f0c29,#1a1a2e,#16213e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.menu-screen.hide{display:none}
.menu-hero{text-align:center;margin-bottom:30px}
.menu-hero .icon{font-size:4em;display:block;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.menu-hero h1{font-size:1.8em;background:linear-gradient(135deg,#FFD700,#FF6B6B,#4ECDC4,#FFD700);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gs 4s ease infinite;margin:8px 0}
@keyframes gs{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.menu-hero .sub{color:rgba(255,255,255,0.5);font-size:0.9em}
.menu-cards{display:flex;gap:20px;max-width:700px;width:100%;flex-wrap:wrap;justify-content:center}
.menu-card{flex:1;min-width:260px;max-width:340px;padding:28px 20px;border-radius:24px;cursor:pointer;transition:all 0.35s;text-align:center;position:relative;overflow:hidden;border:2px solid transparent}
.menu-card:hover{transform:translateY(-8px)}
.menu-card.m1{background:linear-gradient(180deg,rgba(76,175,80,0.2),rgba(76,175,80,0.05));border-color:rgba(76,175,80,0.4);box-shadow:0 8px 32px rgba(76,175,80,0.15)}
.menu-card.m1:hover{border-color:rgba(76,175,80,0.7);box-shadow:0 16px 48px rgba(76,175,80,0.25)}
.menu-card.m2{background:linear-gradient(180deg,rgba(255,152,0,0.2),rgba(255,152,0,0.05));border-color:rgba(255,152,0,0.4);box-shadow:0 8px 32px rgba(255,152,0,0.15)}
.menu-card.m2:hover{border-color:rgba(255,152,0,0.7);box-shadow:0 16px 48px rgba(255,152,0,0.25)}
.menu-card .card-icon{font-size:3.5em;display:block;margin-bottom:8px}
.menu-card .card-title{font-size:1.4em;font-weight:bold;margin-bottom:6px}
.menu-card.m1 .card-title{color:#4CAF50}
.menu-card.m2 .card-title{color:#FF9800}
.menu-card .card-desc{font-size:0.85em;color:rgba(255,255,255,0.6);line-height:1.5;margin-bottom:8px}
.menu-card .card-info{display:inline-block;padding:4px 14px;border-radius:12px;font-size:0.75em;font-weight:bold;margin-top:6px}
.menu-card.m1 .card-info{background:rgba(76,175,80,0.25);color:#81C784}
.menu-card.m2 .card-info{background:rgba(255,152,0,0.25);color:#FFB74D}
.menu-footer{position:absolute;bottom:20px;color:rgba(255,255,255,0.25);font-size:0.75em}

/* ===== 游戏区 ===== */
.game-screen{display:none;flex-direction:column;height:100vh}
.game-screen.show{display:flex}

.mod-banner{text-align:center;padding:6px 12px;background:rgba(0,0,0,0.3);font-size:0.85em;color:#FFD700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.5s;flex-shrink:0}
.mod-banner .mod-icon{font-size:1.3em}
.mod-banner.m1{background:linear-gradient(90deg,rgba(76,175,80,0.2),rgba(0,0,0,0.3),rgba(76,175,80,0.2))}
.mod-banner.m2{background:linear-gradient(90deg,rgba(255,152,0,0.2),rgba(0,0,0,0.3),rgba(255,152,0,0.2))}

.top-bar{display:flex;align-items:center;justify-content:center;padding:8px;gap:16px;background:rgba(0,0,0,0.4);flex-shrink:0}
.top-bar h1{font-size:1.2em;background:linear-gradient(90deg,#FFD700,#FF6B6B,#4ECDC4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.timer{font-size:1.5em;font-weight:bold;color:#FFD700;min-width:60px;text-align:center}
.timer.urgent{color:#FF5252;animation:blink 0.5s infinite}
@keyframes blink{50%{opacity:0.4}}
.round-info{font-size:0.85em;color:#aaa}

.arena{display:flex;flex:1;min-height:0}
.player{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 8px;position:relative;overflow-y:auto;transition:all 0.3s}
.player.left{background:linear-gradient(180deg,rgba(255,107,107,0.15),rgba(0,0,0,0.3));border-right:3px solid #FF6B6B}
.player.right{background:linear-gradient(180deg,rgba(78,205,196,0.15),rgba(0,0,0,0.3));border-left:3px solid #4ECDC4}

.player-name{font-size:1.1em;font-weight:bold;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.left .player-name{color:#FF6B6B}
.right .player-name{color:#4ECDC4}
.player-score{font-size:2em;font-weight:bold;margin:4px 0}
.left .player-score{color:#FF6B6B}
.right .player-score{color:#4ECDC4}
.streak{font-size:0.8em;color:#FFD700;min-height:20px}
.first-badge{font-size:0.75em;color:#FFD700;min-height:18px;animation:pulse 0.6s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

.question-box{background:rgba(255,255,255,0.1);border-radius:14px;padding:14px 10px;margin:6px 0;width:100%;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;font-size:1.05em;line-height:1.5;word-break:break-word;flex-direction:column}
.question-box .q-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:0.7em;background:rgba(255,255,255,0.15)}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;margin:6px 0}
.p-opt{padding:10px 6px;border-radius:12px;border:2px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;font-size:0.85em;font-weight:bold;cursor:pointer;transition:all 0.2s;font-family:inherit;text-align:center;line-height:1.3;min-height:44px;display:flex;align-items:center;justify-content:center}
.p-opt:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.5);transform:scale(1.04)}
.p-opt:active{transform:scale(0.94)}
.p-opt.correct{background:#10B981!important;border-color:#10B981!important;animation:pop 0.4s}
.p-opt.wrong{background:#EF4444!important;border-color:#EF4444!important;animation:shake 0.4s}
.p-opt:disabled{pointer-events:none;opacity:0.5}
.left .p-opt.correct{box-shadow:0 0 20px rgba(255,107,107,0.6)}
.right .p-opt.correct{box-shadow:0 0 20px rgba(78,205,196,0.6)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{font-size:0.85em;font-weight:bold;min-height:22px;text-align:center;margin:3px 0}

.vs-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.5em;font-weight:bold;z-index:10;text-shadow:0 0 30px rgba(255,215,0,0.8);pointer-events:none;animation:vsPulse 1.5s infinite}
@keyframes vsPulse{0%,100%{opacity:0.6;transform:translate(-50%,-50%)scale(1)}50%{opacity:1;transform:translate(-50%,-50%)scale(1.1)}}

.bottom-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px;background:rgba(0,0,0,0.5);flex-wrap:wrap;flex-shrink:0}
.ctrl-btn{padding:10px 22px;border-radius:20px;border:none;font-size:0.9em;font-weight:bold;cursor:pointer;font-family:inherit;transition:all 0.2s}
.ctrl-btn.start{background:linear-gradient(135deg,#FFD700,#FF9800);color:#333}
.ctrl-btn.restart{background:linear-gradient(135deg,#FF6B6B,#ee5a5a);color:#fff}
.ctrl-btn.music{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3)}
.ctrl-btn.back{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.2)}
.ctrl-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,0.3)}

/* ===== 结算弹窗 ===== */
.win-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column}
.win-overlay.show{display:flex}
.win-title{font-size:2.5em;font-weight:bold;margin-bottom:10px;animation:bounceIn 0.6s}
.win-subtitle{font-size:1.2em;color:#ccc;margin-bottom:20px}
.win-scores{display:flex;gap:40px;margin-bottom:20px}
.win-player{text-align:center}
.win-player .wscore{font-size:3em;font-weight:bold}
.win-player.left-w .wscore{color:#FF6B6B}
.win-player.right-w .wscore{color:#4ECDC4}
.win-detail{font-size:0.85em;color:#aaa;margin-bottom:20px;text-align:center;line-height:1.6}
.win-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.win-btns .ctrl-btn{font-size:1.05em;padding:14px 28px}

@keyframes bounceIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}

.confetti{position:fixed;pointer-events:none;z-index:101;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-100px)rotate(0);opacity:1}100%{transform:translateY(105vh)rotate(720deg);opacity:0}}

/* Progress dots */
.progress-dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:200px;margin:4px 0}
.progress-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.2);transition:all 0.3s}
.progress-dot.done.p1{background:#FF6B6B}
.progress-dot.done.p2{background:#4ECDC4}
.progress-dot.current{background:#FFD700;box-shadow:0 0 8px #FFD700;animation:pulse 1s infinite}

@media(max-width:600px){
  .arena{flex-direction:column}
  .player.left{border-right:none;border-bottom:3px solid #FF6B6B}
  .player.right{border-left:none;border-top:3px solid #4ECDC4}
  .player{padding:8px 6px}
  .question-box{font-size:0.9em;min-height:40px;padding:10px}
  .p-opt{font-size:0.75em;padding:8px 4px;min-height:36px}
  .vs-badge{font-size:1.5em;top:50%}
  .player-score{font-size:1.4em}
  .win-title{font-size:1.6em}
  .options-grid{gap:4px}
  .progress-dots{max-width:140px}
  .progress-dot{width:8px;height:8px}
  .menu-hero h1{font-size:1.3em}
  .menu-card{min-width:220px;padding:20px 14px}
  .menu-card .card-icon{font-size:2.5em}
  .menu-card .card-title{font-size:1.1em}
}
</style>
</head>
<body>

<!-- ===== 主菜单 ===== -->
<div class="menu-screen" id="menuScreen">
  <div class="menu-hero">
    <span class="icon">🔢</span>
    <h1>两位数乘除一位数 PK对战</h1>
    <p class="sub">苏教版 · 二年级下册 · 计算与应用</p>
  </div>
  <div class="menu-cards">
    <div class="menu-card m1" onclick="startGame(1)">
      <span class="card-icon">✖️</span>
      <div class="card-title">模块一</div>
      <div class="card-desc">两位数×一位数<br>竖式计算 · 口算速答 · 解决问题</div>
      <span class="card-info">⏱ 15秒/题 · 12轮</span>
    </div>
    <div class="menu-card m2" onclick="startGame(2)">
      <span class="card-icon">➗</span>
      <div class="card-title">模块二</div>
      <div class="card-desc">两位数÷一位数<br>竖式计算 · 有余数除法 · 解决问题</div>
      <span class="card-info">⏱ 15秒/题 · 12轮</span>
    </div>
  </div>
  <div class="menu-footer">⚡ 叫上小伙伴，双人PK对战！</div>
</div>

<!-- ===== 游戏区 ===== -->
<div class="game-screen" id="gameScreen">
  <div class="mod-banner m1" id="modBanner">
    <span class="mod-icon">✖️</span>
    <span id="modLabel">模块一：两位数×一位数 — 计算与应用</span>
    <span class="mod-icon">✖️</span>
  </div>

  <div class="top-bar">
    <h1 id="gameTitle">两位数乘除一位数 ⚔️ PK对战</h1>
    <span class="round-info">第 <span id="rn">1</span>/<span id="tt">12</span> 轮</span>
    <span class="timer">⏱ <span id="tm">15</span>s</span>
  </div>

  <div class="arena">
    <div class="player left" id="p1">
      <div class="player-name">🔴 红方玩家</div>
      <div class="player-score" id="s1">0</div>
      <div class="streak" id="st1"></div>
      <div class="first-badge" id="fb1b"></div>
      <div class="progress-dots" id="pd1"></div>
      <div class="question-box" id="q1">准备开始...</div>
      <div class="options-grid" id="op1"></div>
      <div class="feedback" id="fb1"></div>
    </div>
    <div class="vs-badge">⚡VS⚡</div>
    <div class="player right" id="p2">
      <div class="player-name">🔵 蓝方玩家</div>
      <div class="player-score" id="s2">0</div>
      <div class="streak" id="st2"></div>
      <div class="first-badge" id="fb2b"></div>
      <div class="progress-dots" id="pd2"></div>
      <div class="question-box" id="q2">准备开始...</div>
      <div class="options-grid" id="op2"></div>
      <div class="feedback" id="fb2"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="ctrl-btn start" id="btnStart" style="display:none">⚔️ 开始对战</button>
    <button class="ctrl-btn music" id="btnMusic" onclick="toggleMusic()">🔊 音乐</button>
    <button class="ctrl-btn restart" onclick="restartGame()">🔄 重新开始</button>
    <button class="ctrl-btn back" onclick="goToMenu()">🏠 返回主界面</button>
  </div>
</div>

<!-- ===== 结算弹窗 ===== -->
<div class="win-overlay" id="winOverlay">
  <div class="win-title" id="winTitle"></div>
  <div class="win-subtitle" id="winSub"></div>
  <div class="win-scores">
    <div class="win-player left-w"><div style="color:#FF6B6B">🔴 红方</div><div class="wscore" id="ws1">0</div></div>
    <div class="win-player right-w"><div style="color:#4ECDC4">🔵 蓝方</div><div class="wscore" id="ws2">0</div></div>
  </div>
  <div class="win-detail" id="winDetail"></div>
  <div class="win-btns">
    <button class="ctrl-btn restart" onclick="restartGame()">🔄 再来一局</button>
    <button class="ctrl-btn back" onclick="goToMenu()">🏠 返回主界面</button>
  </div>
</div>

<script>
// ============================================================
// 苏教版 二年级下册：两位数乘/除以一位数
// 模块一：两位数 × 一位数（计算+解决问题）
// 模块二：两位数 ÷ 一位数（计算+有余数+解决问题）
// ============================================================

var ALL_Q = [
  // ===== 模块一：两位数 × 一位数 =====
  {
    q: "✏️ 口算：12 × 3 = ？",
    o: ["36", "39", "33", "42"],
    a: 0,
    mod: 1,
    explain: "12×3：先算10×3=30，再算2×3=6，30+6=36"
  },
  {
    q: "✏️ 口算：23 × 4 = ？",
    o: ["82", "92", "88", "96"],
    a: 1,
    mod: 1,
    explain: "23×4：20×4=80，3×4=12，80+12=92"
  },
  {
    q: "✏️ 计算：15 × 6 = ？",
    o: ["80", "96", "84", "90"],
    a: 3,
    mod: 1,
    explain: "15×6：10×6=60，5×6=30，60+30=90"
  },
  {
    q: "✏️ 计算：34 × 2 = ？",
    o: ["62", "68", "72", "64"],
    a: 1,
    mod: 1,
    explain: "34×2：30×2=60，4×2=8，60+8=68"
  },
  {
    q: "✏️ 计算：18 × 5 = ？",
    o: ["85", "95", "90", "80"],
    a: 2,
    mod: 1,
    explain: "18×5：10×5=50，8×5=40，50+40=90"
  },
  {
    q: "✏️ 计算：25 × 4 = ？",
    o: ["90", "100", "110", "96"],
    a: 1,
    mod: 1,
    explain: "25×4=100，25+25+25+25=100"
  },
  {
    q: "📦 每盒有24支彩笔，买了3盒，<br>一共有多少支彩笔？",
    o: ["62支", "68支", "72支", "78支"],
    a: 2,
    mod: 1,
    explain: "24×3：20×3=60，4×3=12，60+12=72（支）"
  },
  {
    q: "✏️ 计算：42 × 3 = ？",
    o: ["126", "120", "132", "116"],
    a: 0,
    mod: 1,
    explain: "42×3：40×3=120，2×3=6，120+6=126"
  },
  {
    q: "🎬 每排有16个座位，5排一共有<br>多少个座位？",
    o: ["70个", "75个", "80个", "85个"],
    a: 2,
    mod: 1,
    explain: "16×5：10×5=50，6×5=30，50+30=80（个）"
  },
  {
    q: "✏️ 计算：30 × 7 = ？",
    o: ["180", "210", "240", "190"],
    a: 1,
    mod: 1,
    explain: "30×7=210，3个十×7=21个十=210"
  },
  {
    q: "📖 小明每天看28页书，看了3天，<br>一共看了多少页？",
    o: ["74页", "78页", "82页", "84页"],
    a: 3,
    mod: 1,
    explain: "28×3：20×3=60，8×3=24，60+24=84（页）"
  },
  {
    q: "✏️ 计算：19 × 5 = ？",
    o: ["85", "90", "95", "100"],
    a: 2,
    mod: 1,
    explain: "19×5：20×5=100，减去1×5=5，100−5=95"
  },

  // ===== 模块二：两位数 ÷ 一位数 =====
  {
    q: "✏️ 口算：48 ÷ 4 = ？",
    o: ["10", "11", "12", "14"],
    a: 2,
    mod: 2,
    explain: "48÷4=12，4×12=48"
  },
  {
    q: "✏️ 计算：75 ÷ 5 = ？",
    o: ["13", "14", "15", "16"],
    a: 2,
    mod: 2,
    explain: "75÷5=15，5×15=75"
  },
  {
    q: "✏️ 计算：96 ÷ 3 = ？",
    o: ["30", "31", "32", "33"],
    a: 2,
    mod: 2,
    explain: "96÷3=32，90÷3=30，6÷3=2，30+2=32"
  },
  {
    q: "✏️ 计算：84 ÷ 6 = ？",
    o: ["12", "13", "14", "15"],
    a: 2,
    mod: 2,
    explain: "84÷6=14，6×14=84"
  },
  {
    q: "✏️ 计算：56 ÷ 4 = ？",
    o: ["12", "13", "14", "15"],
    a: 2,
    mod: 2,
    explain: "56÷4=14，4×14=56"
  },
  {
    q: "✏️ 计算：91 ÷ 7 = ？",
    o: ["11", "12", "13", "14"],
    a: 2,
    mod: 2,
    explain: "91÷7=13，7×13=91"
  },
  {
    q: "✏️ 计算：72 ÷ 3 = ？",
    o: ["22", "23", "24", "26"],
    a: 2,
    mod: 2,
    explain: "72÷3=24，60÷3=20，12÷3=4，20+4=24"
  },
  {
    q: "🍬 84颗糖平均分给4个小朋友，<br>每人分到多少颗？",
    o: ["20颗", "21颗", "22颗", "18颗"],
    a: 1,
    mod: 2,
    explain: "84÷4=21，80÷4=20，4÷4=1，20+1=21（颗）"
  },
  {
    q: "✏️ 计算：68 ÷ 2 = ？",
    o: ["32", "33", "34", "36"],
    a: 2,
    mod: 2,
    explain: "68÷2=34，60÷2=30，8÷2=4，30+4=34"
  },
  {
    q: "✏️ 50 ÷ 8 = ？<br>（有余数除法）",
    o: ["6余2", "5余10", "7余1", "6余1"],
    a: 0,
    mod: 2,
    explain: "50÷8=6余2，8×6=48，50−48=2"
  },
  {
    q: "📚 把78本练习本平均分给6个班，<br>每班分到多少本？",
    o: ["11本", "12本", "13本", "14本"],
    a: 2,
    mod: 2,
    explain: "78÷6=13，60÷6=10，18÷6=3，10+3=13（本）"
  },
  {
    q: "✏️ 计算：90 ÷ 5 = ？",
    o: ["16", "17", "18", "19"],
    a: 2,
    mod: 2,
    explain: "90÷5=18，50÷5=10，40÷5=8，10+8=18"
  }
];

var Q=[], sc=[0,0], cr=0, tr=0, tm=15, baseTm=15, ti=null, go=false, ans=[false,false];
var streak=[0,0], firstToAnswer=null, currentMod=0;
var baseSk='pk_mul_div_1digit_v1';
var musicOn=true, actx=null;

function sf(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}

function initAudio(){if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();}}

function playTone(f,d,ty,vol){if(!musicOn||!actx)return;try{var o=actx.createOscillator();var g=actx.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,actx.currentTime);g.gain.setValueAtTime(vol||0.1,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

function sfxCorrect(){playTone(523,0.12,'square',0.08);setTimeout(function(){playTone(659,0.12,'square',0.08);},90);setTimeout(function(){playTone(784,0.18,'square',0.08);},180);}
function sfxWrong(){playTone(200,0.3,'sawtooth',0.06);}
function sfxWin(){for(var i=0;i<8;i++){setTimeout(function(){playTone(440+Math.random()*440,0.15,'square',0.07);},i*120);}}
function sfxTick(){playTone(800,0.05,'sine',0.04);}
function sfxFirst(){playTone(880,0.1,'square',0.07);setTimeout(function(){playTone(1100,0.15,'square',0.07);},80);}

function toggleMusic(){initAudio();musicOn=!musicOn;document.getElementById('btnMusic').textContent=musicOn?'🔊 音乐':'🔇 静音';if(musicOn){playTone(440,0.1,'sine',0.05);}}

function updateProgressDots(){
  for(var p=1;p<=2;p++){
    var h='';
    for(var i=0;i<tr;i++){
      var cls='progress-dot';
      if(i<cr)cls+=' done p'+p;
      if(i===cr)cls+=' current';
      h+='<div class="'+cls+'"></div>';
    }
    document.getElementById('pd'+p).innerHTML=h;
  }
  document.getElementById('tt').textContent=tr;
}

// ===== 启动游戏 =====
function startGame(mod){
  initAudio();
  currentMod=mod;

  // Filter questions for selected module
  Q=[];
  for(var i=0;i<ALL_Q.length;i++){
    if(ALL_Q[i].mod===mod)Q.push(ALL_Q[i]);
  }
  Q=sf(Q);
  tr=Q.length;
  baseTm=15;
  tm=baseTm;

  // Update UI for module
  var banner=document.getElementById('modBanner');
  var label=document.getElementById('modLabel');
  var title=document.getElementById('gameTitle');
  if(mod===1){
    banner.className='mod-banner m1';
    label.textContent='模块一：两位数×一位数 — 计算与解决问题';
    title.textContent='模块一 · 两位数×一位数 ⚔️ PK对战';
  } else {
    banner.className='mod-banner m2';
    label.textContent='模块二：两位数÷一位数 — 计算与解决问题';
    title.textContent='模块二 · 两位数÷一位数 ⚔️ PK对战';
  }

  // Switch screens
  document.getElementById('menuScreen').classList.add('hide');
  document.getElementById('gameScreen').classList.add('show');
  document.getElementById('winOverlay').classList.remove('show');

  // Reset game state
  sc=[0,0]; cr=0; ans=[false,false]; streak=[0,0]; firstToAnswer=null;
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  document.getElementById('fb1').textContent='';
  document.getElementById('fb2').textContent='';
  document.getElementById('fb1b').textContent='';
  document.getElementById('fb2b').textContent='';
  document.getElementById('st1').textContent='';
  document.getElementById('st2').textContent='';
  document.getElementById('q1').textContent='准备开始...';
  document.getElementById('q2').textContent='准备开始...';
  document.getElementById('op1').innerHTML='';
  document.getElementById('op2').innerHTML='';
  document.getElementById('tm').textContent=tm;
  document.getElementById('tm').parentElement.className='timer';
  document.getElementById('btnStart').style.display='none';

  go=true;
  updateProgressDots();
  nextRound();
}

// ===== 返回主界面 =====
function goToMenu(){
  clearInterval(ti); go=false;
  document.getElementById('menuScreen').classList.remove('hide');
  document.getElementById('gameScreen').classList.remove('show');
  document.getElementById('winOverlay').classList.remove('show');
  var cf=document.querySelectorAll('.confetti');cf.forEach(function(c){c.remove();});
}

function nextRound(){
  if(cr>=tr){endGame();return;}

  // Reset timer for new round
  tm=baseTm;

  var q=Q[cr];
  ans=[false,false]; firstToAnswer=null;
  document.getElementById('rn').textContent=cr+1;
  document.getElementById('tm').textContent=tm;
  document.getElementById('tm').parentElement.className='timer';

  updateProgressDots();
  renderPlayer(1,q);
  renderPlayer(2,q);

  go=true;
  clearInterval(ti);
  ti=setInterval(function(){
    tm--;
    document.getElementById('tm').textContent=tm;
    if(tm<=5){sfxTick();document.getElementById('tm').parentElement.className='timer urgent';}
    if(tm<=0){clearInterval(ti);timeUp();}
  },1000);
}

function renderPlayer(pn,q){
  var qEl=document.getElementById('q'+pn);
  var tag='';
  if(currentMod===1)tag='<span class="q-tag" style="background:rgba(76,175,80,0.25)">✖️ 乘法计算</span><br>';
  else tag='<span class="q-tag" style="background:rgba(255,152,0,0.25)">➗ 除法计算</span><br>';
  qEl.innerHTML=tag+'第'+(cr+1)+'题：'+q.q;

  var ix=[0,1,2,3];
  for(var i=ix.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ix[i];ix[i]=ix[j];ix[j]=t;}

  var lb=['A','B','C','D'];
  var h='';
  for(var i=0;i<4;i++){
    var oi=ix[i];
    h+='<button class="p-opt" onclick="answer('+pn+','+oi+','+q.a+',this)" id="ob'+pn+'_'+i+'">'+lb[i]+'. '+q.o[oi]+'</button>';
  }
  document.getElementById('op'+pn).innerHTML=h;
  document.getElementById('fb'+pn).textContent='';
  document.getElementById('fb'+pn+'b').textContent='';
  document.getElementById('st'+pn).textContent='';

  qEl.style.display='';
  document.getElementById('op'+pn).style.display='';
}

function answer(pn,oi,ai,btn){
  if(!go||ans[pn-1])return;
  ans[pn-1]=true;

  var bs=document.querySelectorAll('#op'+pn+' .p-opt');
  bs.forEach(function(b){b.disabled=true;});

  var correct=oi===ai;
  var q=Q[cr];

  if(correct){
    btn.classList.add('correct');

    var baseScore=10;
    var streakBonus=0;
    var firstBonus=0;

    streak[pn-1]++;
    if(streak[pn-1]>=3){
      streakBonus=2;
      document.getElementById('st'+pn).textContent='🔥 '+streak[pn-1]+'连击！+'+streakBonus;
    } else {
      document.getElementById('st'+pn).textContent=streak[pn-1]>=2?'💪 答对了！':'✅ 答对了！';
    }

    if(firstToAnswer===null){
      firstToAnswer=pn;
      firstBonus=3;
      document.getElementById('fb'+pn+'b').textContent='⚡ 抢答成功！+'+firstBonus;
      sfxFirst();
    }

    var total=baseScore+streakBonus+firstBonus;
    sc[pn-1]+=total;
    document.getElementById('s'+pn).textContent=sc[pn-1];
    document.getElementById('fb'+pn).innerHTML='✅ 正确！+'+total+' <small style="color:#aaa">('+q.explain+')</small>';
    sfxCorrect();

    // Lock both players and advance immediately
    go=false;
    var otherPn=pn===1?2:1;
    var otherBs=document.querySelectorAll('#op'+otherPn+' .p-opt');
    otherBs.forEach(function(b){b.disabled=true;});
    if(!ans[otherPn-1])document.getElementById('fb'+otherPn).innerHTML='⏩ 对方已答对，进入下一题';
    clearInterval(ti);
    cr++;
    setTimeout(function(){nextRound();},1800);

  } else {
    btn.classList.add('wrong');
    streak[pn-1]=0;
    sc[pn-1]=Math.max(0,sc[pn-1]-2);
    document.getElementById('s'+pn).textContent=sc[pn-1];
    document.getElementById('st'+pn).textContent='';
    document.getElementById('fb'+pn).innerHTML='❌ 答错了 −2分 <small style="color:#aaa">('+q.explain+')</small>';
    sfxWrong();

    for(var i=0;i<bs.length;i++){
      var lb=['A','B','C','D'];
      if(bs[i].textContent.indexOf(lb[ai]+'.')>=0)bs[i].classList.add('correct');
    }

    // If both answered wrong, advance
    if(ans[0]&&ans[1]){
      clearInterval(ti);
      cr++;
      setTimeout(function(){nextRound();},1800);
    }
  }
}

function timeUp(){
  for(var p=1;p<=2;p++){
    if(!ans[p-1]){
      var bs=document.querySelectorAll('#op'+p+' .p-opt');
      bs.forEach(function(b){b.disabled=true;});
      document.getElementById('fb'+p).innerHTML='⏰ 时间到！';
      streak[p-1]=0;
    }
  }
  cr++;
  setTimeout(function(){nextRound();},1200);
}

function endGame(){
  go=false; clearInterval(ti);
  document.getElementById('winOverlay').classList.add('show');
  document.getElementById('ws1').textContent=sc[0];
  document.getElementById('ws2').textContent=sc[1];

  var modName='';
  if(currentMod===1)modName='模块一·两位数×一位数';
  else modName='模块二·两位数÷一位数';
  var detail='';
  if(sc[0]>sc[1]){
    document.getElementById('winTitle').innerHTML='🔴 红方获胜！';
    document.getElementById('winTitle').style.color='#FF6B6B';
    document.getElementById('winSub').textContent='红方 '+sc[0]+' : '+sc[1]+' 蓝方';
    detail=modName+' — 红方是计算小达人！';
  } else if(sc[1]>sc[0]){
    document.getElementById('winTitle').innerHTML='🔵 蓝方获胜！';
    document.getElementById('winTitle').style.color='#4ECDC4';
    document.getElementById('winSub').textContent='蓝方 '+sc[1]+' : '+sc[0]+' 红方';
    detail=modName+' — 蓝方是计算小达人！';
  } else {
    document.getElementById('winTitle').innerHTML='🤝 平局！';
    document.getElementById('winTitle').style.color='#FFD700';
    document.getElementById('winSub').textContent='双方都是 '+sc[0]+' 分';
    detail=modName+' — 旗鼓相当！再来一局分出胜负吧！';
  }
  document.getElementById('winDetail').textContent=detail;
  sfxWin();
  spawnConfetti();

  var sk=baseSk+'_m'+currentMod;
  var best=parseInt(localStorage.getItem(sk)||'0');
  var mx=Math.max(sc[0],sc[1]);
  if(mx>best){localStorage.setItem(sk,mx);}
}

function spawnConfetti(){
  var colors=['#FF6B6B','#4ECDC4','#FFD700','#FF9800','#6C5CE7','#66BB6A','#EC407A','#42A5F5','#4CAF50'];
  for(var i=0;i<80;i++){
    var d=document.createElement('div');
    d.className='confetti';
    d.style.left=Math.random()*100+'%';
    d.style.top=-(Math.random()*50+10)+'px';
    d.style.width=(Math.random()*12+6)+'px';
    d.style.height=(Math.random()*12+6)+'px';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(Math.random()*2.5+2)+'s';
    d.style.animationDelay=Math.random()*1.5+'s';
    d.style.borderRadius=Math.random()>0.5?'50%':'0';
    document.body.appendChild(d);
    setTimeout(function(){d.remove();},5000);
  }
}

function restartGame(){
  if(currentMod===0)return;
  clearInterval(ti); go=false;
  sc=[0,0]; cr=0; ans=[false,false]; streak=[0,0]; firstToAnswer=null;
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  document.getElementById('fb1').textContent='';
  document.getElementById('fb2').textContent='';
  document.getElementById('fb1b').textContent='';
  document.getElementById('fb2b').textContent='';
  document.getElementById('st1').textContent='';
  document.getElementById('st2').textContent='';
  document.getElementById('rn').textContent='1';
  document.getElementById('tm').textContent=tm;
  document.getElementById('tm').parentElement.className='timer';
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('q1').textContent='准备开始...';
  document.getElementById('q2').textContent='准备开始...';
  document.getElementById('op1').innerHTML='';
  document.getElementById('op2').innerHTML='';
  document.getElementById('pd1').innerHTML='';
  document.getElementById('pd2').innerHTML='';
  Q=sf(Q);
  updateProgressDots();
  var cf=document.querySelectorAll('.confetti');cf.forEach(function(c){c.remove();});
  go=true;
  nextRound();
}
</script>
</body>
</html>
