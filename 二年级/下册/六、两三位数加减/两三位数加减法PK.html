<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>两三位数加减法PK - PK对战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none;color:#fff;touch-action:manipulation}

.top-bar{display:flex;align-items:center;justify-content:center;padding:4px 8px;gap:8px;background:rgba(0,0,0,0.4);flex-wrap:wrap}
.top-bar h1{font-size:1em;background:linear-gradient(90deg,#FFD700,#FF6B6B,#4ECDC4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.timer{font-size:1.2em;font-weight:bold;color:#FFD700;min-width:48px;text-align:center}
.round-info{font-size:0.75em;color:#aaa}

.module-tabs{display:flex;align-items:center;justify-content:center;gap:3px;padding:3px 4px;background:rgba(0,0,0,0.3);flex-wrap:wrap}
.mod-tab{padding:4px 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#ccc;font-size:0.65em;font-weight:bold;cursor:pointer;transition:all 0.2s;font-family:inherit;white-space:nowrap}
.mod-tab:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.4)}
.mod-tab.active{background:linear-gradient(135deg,#FFD700,#FF9800);border-color:#FFD700;color:#333}

.arena{display:flex;flex:1;height:calc(100vh - 175px);position:relative}
.player{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px;position:relative;overflow-y:auto;transition:all 0.3s}
.player.left{background:linear-gradient(180deg,rgba(255,107,107,0.1),rgba(0,0,0,0.3));border-right:2px solid #FF6B6B}
.player.right{background:linear-gradient(180deg,rgba(78,205,196,0.1),rgba(0,0,0,0.3));border-left:2px solid #4ECDC4}
.player-name{font-size:0.85em;font-weight:bold;margin-bottom:1px}
.left .player-name{color:#FF6B6B}
.right .player-name{color:#4ECDC4}
.player-score{font-size:1.3em;font-weight:bold;margin:1px 0}
.left .player-score{color:#FF6B6B}
.right .player-score{color:#4ECDC4}
.streak{font-size:0.68em;color:#FFD700;min-height:15px}

/* 题目区 */
.question-text{font-size:0.82em;text-align:center;padding:5px 6px;margin:2px 0;background:rgba(255,255,255,0.08);border-radius:10px;width:100%;line-height:1.4;min-height:28px}

/* 竖式计算展示 */
.vert-calc{display:inline-block;font-family:'Courier New',monospace;font-size:0.9em;line-height:1.5;text-align:right;padding:6px 10px;background:rgba(255,255,255,0.06);border-radius:8px;margin:3px 0}
.vert-calc .row{white-space:pre;letter-spacing:2px}
.vert-calc .op-line{border-bottom:2px solid rgba(255,255,255,0.4);padding-bottom:2px;margin-bottom:2px}
.vert-calc .highlight{color:#FFD700;font-weight:bold}

/* 计数器 */
.counter-wrap{width:100%;margin:4px 0;padding:6px;background:rgba(255,255,255,0.04);border-radius:10px}
.counter-label{font-size:0.65em;color:#aaa;text-align:center;margin-bottom:4px}
.counter{display:flex;justify-content:center;gap:8px}
.counter-col{display:flex;flex-direction:column;align-items:center;gap:1px}
.col-title{font-size:0.62em;color:#aaa;margin-bottom:2px}
.bead-stack{display:flex;flex-direction:column;gap:2px;padding:3px;background:rgba(0,0,0,0.2);border-radius:8px}
.bead{width:24px;height:14px;border-radius:10px;cursor:pointer;transition:all 0.15s;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2)}
.bead.filled{background:linear-gradient(180deg,#FFD700,#FF9800);border-color:#FFD700;box-shadow:0 0 6px rgba(255,215,0,0.4)}
.bead:hover{background:rgba(255,255,255,0.3)}
.col-digit{font-size:1.1em;font-weight:bold;color:#FFD700;margin-top:2px;min-width:20px;text-align:center}
.counter-total{font-size:0.75em;color:#ccc;text-align:center;margin-top:4px}
.counter-total span{color:#FFD700;font-weight:bold;font-size:1.1em}

/* 实物展示 */
.display-area{width:100%;padding:5px;margin:3px 0;background:rgba(255,255,255,0.04);border-radius:10px;text-align:center;font-size:0.78em;line-height:1.5}

.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;margin:3px 0}
.p-opt{padding:8px 6px;border-radius:10px;border:2px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;font-size:0.76em;font-weight:bold;cursor:pointer;transition:all 0.2s;font-family:inherit;text-align:center;line-height:1.3;min-height:38px;display:flex;align-items:center;justify-content:center}
.p-opt:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.5);transform:scale(1.03)}
.p-opt:active{transform:scale(0.95)}
.p-opt.correct{background:#10B981!important;border-color:#10B981!important;animation:pop 0.4s}
.p-opt.wrong{background:#EF4444!important;border-color:#EF4444!important;animation:shake 0.4s}
.p-opt:disabled{pointer-events:none;opacity:0.5}
.left .p-opt.correct{box-shadow:0 0 18px rgba(255,107,107,0.6)}
.right .p-opt.correct{box-shadow:0 0 18px rgba(78,205,196,0.6)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.feedback{font-size:0.72em;font-weight:bold;min-height:17px;text-align:center;margin:1px 0}

.vs-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.6em;font-weight:bold;z-index:10;text-shadow:0 0 25px rgba(255,215,0,0.8);pointer-events:none;animation:vsPulse 1.5s infinite}
@keyframes vsPulse{0%,100%{opacity:0.6;transform:translate(-50%,-50%)scale(1)}50%{opacity:1;transform:translate(-50%,-50%)scale(1.1)}}

.bottom-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:5px;background:rgba(0,0,0,0.5);flex-wrap:wrap}
.ctrl-btn{padding:7px 16px;border-radius:16px;border:none;font-size:0.78em;font-weight:bold;cursor:pointer;font-family:inherit;transition:all 0.2s}
.ctrl-btn.start{background:linear-gradient(135deg,#FFD700,#FF9800);color:#333}
.ctrl-btn.restart{background:linear-gradient(135deg,#FF6B6B,#ee5a5a);color:#fff}
.ctrl-btn.music{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3)}
.ctrl-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,0.3)}

.win-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column}
.win-overlay.show{display:flex}
.win-title{font-size:1.8em;font-weight:bold;margin-bottom:6px;animation:bounceIn 0.6s}
.win-subtitle{font-size:0.95em;color:#ccc;margin-bottom:12px}
.win-scores{display:flex;gap:20px;margin-bottom:12px}
.win-player{text-align:center}
.win-player .wscore{font-size:2.2em;font-weight:bold}
.win-player.left-w .wscore{color:#FF6B6B}
.win-player.right-w .wscore{color:#4ECDC4}
@keyframes bounceIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;pointer-events:none;z-index:201;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-100px)rotate(0);opacity:1}100%{transform:translateY(105vh)rotate(720deg);opacity:0}}

@media(max-width:600px){
  .arena{flex-direction:column;height:auto;min-height:calc(100vh - 180px)}
  .player.left{border-right:none;border-bottom:2px solid #FF6B6B}
  .player.right{border-left:none;border-top:2px solid #4ECDC4}
  .player{padding:3px}
  .vert-calc{font-size:0.75em}
  .bead{width:20px;height:12px}
  .question-text{font-size:0.72em;min-height:24px}
  .p-opt{font-size:0.7em;padding:6px 4px;min-height:32px}
  .vs-badge{font-size:1em;top:50%}
  .player-score{font-size:1.1em}
  .win-title{font-size:1.2em}
  .mod-tab{font-size:0.6em;padding:3px 6px}
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>两三位数加减法PK ⚔️</h1>
  <span class="round-info">第<span id="rn">1</span>/10轮</span>
  <span class="timer">⏱ <span id="tm">20</span>s</span>
</div>

<div class="module-tabs" id="modTabs">
  <button class="mod-tab active" onclick="setModule(0)">📋综合</button>
  <button class="mod-tab" onclick="setModule(1)">M1口算+估算</button>
  <button class="mod-tab" onclick="setModule(2)">M2不进位加法</button>
  <button class="mod-tab" onclick="setModule(3)">M3进位+计数器</button>
  <button class="mod-tab" onclick="setModule(4)">M4连加竖式</button>
  <button class="mod-tab" onclick="setModule(5)">M5不退位减法</button>
  <button class="mod-tab" onclick="setModule(6)">M6退位减法</button>
</div>

<div class="arena">
  <div class="player left" id="p1">
    <div class="player-name">🔴 红方</div>
    <div class="player-score" id="s1">0</div>
    <div class="streak" id="st1"></div>
    <div class="question-text" id="q1">准备开始...</div>
    <div class="display-area" id="da1"></div>
    <div class="counter-wrap" id="cw1"></div>
    <div class="options-grid" id="op1"></div>
    <div class="feedback" id="fb1"></div>
  </div>
  <div class="vs-badge">⚡VS⚡</div>
  <div class="player right" id="p2">
    <div class="player-name">🔵 蓝方</div>
    <div class="player-score" id="s2">0</div>
    <div class="streak" id="st2"></div>
    <div class="question-text" id="q2">准备开始...</div>
    <div class="display-area" id="da2"></div>
    <div class="counter-wrap" id="cw2"></div>
    <div class="options-grid" id="op2"></div>
    <div class="feedback" id="fb2"></div>
  </div>
</div>

<div class="bottom-bar">
  <button class="ctrl-btn start" id="btnStart" onclick="startGame()">⚔️ 开始对战</button>
  <button class="ctrl-btn music" id="btnMusic" onclick="toggleMusic()">🔊 音乐</button>
  <button class="ctrl-btn restart" onclick="restartGame()">🔄 重新开始</button>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-title" id="winTitle"></div>
  <div class="win-subtitle" id="winSub"></div>
  <div class="win-scores">
    <div class="win-player left-w"><div style="color:#FF6B6B">🔴红方</div><div class="wscore" id="ws1">0</div></div>
    <div class="win-player right-w"><div style="color:#4ECDC4">🔵蓝方</div><div class="wscore" id="ws2">0</div></div>
  </div>
  <button class="ctrl-btn restart" onclick="restartGame()" style="font-size:1em;padding:10px 28px">🔄 再来一局</button>
</div>

<script>
// ==================== 音效 ====================
var musicOn=true,actx=null;
function initAudio(){if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();}}
function playTone(f,d,ty,vol){if(!musicOn||!actx)return;try{var o=actx.createOscillator();var g=actx.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,actx.currentTime);g.gain.setValueAtTime(vol||0.07,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
function sfxCorrect(){playTone(523,0.12,'square',0.05);setTimeout(function(){playTone(659,0.12,'square',0.05);},80);setTimeout(function(){playTone(784,0.18,'square',0.05);},160);}
function sfxWrong(){playTone(200,0.25,'sawtooth',0.04);}
function sfxClick(){playTone(880,0.06,'sine',0.04);}
function sfxWin(){for(var i=0;i<5;i++){setTimeout(function(){playTone(523+Math.random()*500,0.18,'square',0.05);},i*130);}}
function sfxTick(){playTone(800,0.04,'sine',0.03);}
function toggleMusic(){initAudio();musicOn=!musicOn;document.getElementById('btnMusic').textContent=musicOn?'🔊 音乐':'🔇 静音';if(musicOn)playTone(440,0.08,'sine',0.04);}

// ==================== 工具 ====================
function sf(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

// ==================== 游戏状态 ====================
var sc=[0,0],cr=0,tr=10,tm=20,ti=null,go=false,ans=[false,false];
var curModule=0, roundData=null;
var counterVals={1:[0,0,0],2:[0,0,0]}; // [百,十,个]
var sk='pk_addsub_'+window.location.pathname.replace(/[\/\.\s]/g,'_').replace(/^_+|_+$/g,'');

// ==================== 竖式计算渲染 ====================
function formatVertCalc(n1, op, n2, result, highlight) {
  var s1=n1.toString(), s2=n2.toString(), sr=result.toString();
  var maxLen=Math.max(s1.length, s2.length+(op?1:0), sr.length);
  var lines='';
  lines+='<div class="row">'+' '.repeat(maxLen-s1.length)+s1+'</div>';
  if(op) lines+='<div class="row op-line">'+op+' '+' '.repeat(maxLen-s2.length-2)+s2+'</div>';
  else lines+='<div class="row op-line">'+' '.repeat(maxLen-sr.length)+sr+'</div>';
  if(highlight){
    // 高亮指定位数
    var pos=maxLen-highlight;
    var before=' '.repeat(pos);
    var hl=sr.charAt(highlight-1);
    lines+='<div class="row">'+before+'<span class="highlight">'+hl+'</span>'+sr.substring(pos+1)+'</div>';
  }
  return '<div class="vert-calc">'+lines+'</div>';
}

// 带数位分解的竖式
function formatVertCalcWithPlace(n1, n2, result) {
  var s1=n1.toString(), s2=n2.toString(), sr=result.toString();
  var maxLen=Math.max(s1.length, s2.length+2, sr.length);
  var lines='';
  lines+='<div class="row">'+' '.repeat(maxLen-s1.length)+s1+'</div>';
  lines+='<div class="row op-line">+ '+' '.repeat(maxLen-s2.length-2)+s2+'</div>';
  lines+='<div class="row">'+'-'.repeat(maxLen)+'</div>';
  lines+='<div class="row">'+' '.repeat(maxLen-sr.length)+sr+'</div>';
  return '<div class="vert-calc">'+lines+'</div>';
}

// 减法竖式
function formatSubCalc(n1, n2, result) {
  var s1=n1.toString(), s2=n2.toString(), sr=result.toString();
  var maxLen=Math.max(s1.length, s2.length+2, sr.length);
  var lines='';
  lines+='<div class="row">'+' '.repeat(maxLen-s1.length)+s1+'</div>';
  lines+='<div class="row op-line">- '+' '.repeat(maxLen-s2.length-2)+s2+'</div>';
  lines+='<div class="row">'+'-'.repeat(maxLen)+'</div>';
  lines+='<div class="row" style="color:#FFD700">'+' '.repeat(maxLen-sr.length)+sr+'</div>';
  return '<div class="vert-calc">'+lines+'</div>';
}

// 连加竖式
function formatMultiAdd(n1, n2, n3, result) {
  var s1=n1.toString(), s2=n2.toString(), s3=n3.toString(), sr=result.toString();
  var maxLen=Math.max(s1.length, s2.length, s3.length+2, sr.length);
  var lines='';
  lines+='<div class="row">'+' '.repeat(maxLen-s1.length)+s1+'</div>';
  lines+='<div class="row">'+' '.repeat(maxLen-s2.length)+s2+'</div>';
  lines+='<div class="row op-line">+ '+' '.repeat(maxLen-s3.length-2)+s3+'</div>';
  lines+='<div class="row">'+'-'.repeat(maxLen)+'</div>';
  lines+='<div class="row">'+' '.repeat(maxLen-sr.length)+sr+'</div>';
  return '<div class="vert-calc">'+lines+'</div>';
}

// ==================== 计数器渲染 ====================
function renderCounter(pn, cols) {
  cols=cols||3;
  var cw=document.getElementById('cw'+pn);
  var vals=counterVals[pn];
  while(vals.length<cols) vals.push(0);
  var colNames=cols===4?['千','百','十','个']:['百','十','个'];
  var h='<div class="counter-label">🔢 计数器（点击算珠设定数值）</div><div class="counter">';
  for(var c=0;c<cols;c++){
    h+='<div class="counter-col"><div class="col-title">'+colNames[c]+'位</div><div class="bead-stack">';
    for(var b=9;b>=1;b--){
      h+='<div class="bead'+(b<=vals[c]?' filled':'')+'" onclick="beadClick('+pn+','+c+','+b+')"></div>';
    }
    h+='</div><div class="col-digit">'+vals[c]+'</div></div>';
  }
  h+='</div><div class="counter-total">当前数值：<span>'+formatNumber(vals)+'</span></div>';
  cw.innerHTML=h;
  cw.style.display='block';
}

function beadClick(pn, col, pos) {
  if(!go)return;
  sfxClick();
  if(counterVals[pn][col]===pos){
    counterVals[pn][col]=0;
  } else {
    counterVals[pn][col]=pos;
  }
  renderCounter(pn, counterVals[pn].length);
}

function formatNumber(vals){
  var total=0;
  for(var i=0;i<vals.length;i++){total=total*10+vals[i];}
  return total;
}

function setCounter(pn, num, cols){
  cols=cols||3;
  var v=[];
  var s=num.toString();
  while(s.length<cols) s='0'+s;
  for(var i=0;i<cols;i++) v.push(parseInt(s.charAt(i))||0);
  counterVals[pn]=v;
  renderCounter(pn, cols);
}

function hideCounter(pn){
  document.getElementById('cw'+pn).style.display='none';
  document.getElementById('cw'+pn).innerHTML='';
}

// ==================== 题目生成 ====================

// M1: 个位是零的口算 + 够不够估算
function genM1() {
  var subType=Math.random();
  if(subType<0.55){
    // 口算：个位是0，和不超过1000
    var isAdd=Math.random()<0.5;
    var a,b,answer; var ok=false; var safety=0;
    while(!ok && safety<30){ safety++;
      if(Math.random()<0.5){a=randInt(10,49)*10;b=randInt(1,49)*10;}
      else {a=randInt(10,49)*10;b=randInt(10,49)*10;}
      if(isAdd){answer=a+b;} else {if(a<b){var t=a;a=b;b=t;} answer=a-b;}
      if(!isAdd||answer<=1000) ok=true;
    }
    var op=isAdd?'+':'-';
    return {
      type:'m1', tag:'口算(个位是0)',
      q:a+' '+op+' '+b+' = ？',
      o:genNumOpts(answer), a:0, module:1
    };
  } else {
    // 估算：够不够
    var n1=randInt(15,49)*10; var n2=randInt(10,49)*10;
    var sum=n1+n2;
    var threshold=Math.round(sum/100)*100;
    if(threshold===sum) threshold+=50;
    if(Math.abs(threshold-sum)<20) threshold+=(threshold>sum?30:-30);
    var enough=sum>=threshold;
    var qText=n1+' + '+n2+' 够不够 '+threshold+'？';
    var opts=[enough?'够':'不够', enough?'不够':'够', '正好等于', '无法判断'];
    return {
      type:'m1', tag:'估算(够不够)',
      q:qText, o:opts, a:0, module:1
    };
  }
}

// M2: 不进位笔算加法 + 竖式理解（几十加几十 / 几百加几百）
function genM2() {
  var digits=randInt(2,3);
  var a=[],b=[]; var ok=false; var n1,n2,sum; var safety=0;
  while(!ok && safety<80){ safety++;
    a=[];b=[];
    for(var i=0;i<digits;i++){
      var maxD1=(i===0&&digits===3)?4:8;
      var d1=randInt(1,maxD1);
      var d2=randInt(1,9-d1);
      a.push(d1); b.push(d2);
    }
    n1=parseInt(a.join('')); n2=parseInt(b.join(''));
    sum=n1+n2;
    if(sum<=1000) ok=true;
  }

  // 50% 直接计算题，50% 数位含义题
  if(Math.random()<0.5){
    return {
      type:'m2', tag:'不进位加法',
      q:'看竖式计算：'+n1+' + '+n2+' = ？',
      o:genNumOpts(sum), a:0, module:2,
      n1:n1, n2:n2, sum:sum, digits:digits
    };
  }

  // 数位含义题：几十加几十 / 几百加几百
  var placeIdx=randInt(0,digits-1);
  var placeNames=['个位','十位','百位'];
  var placeName=placeNames[placeIdx];
  var dA=a[digits-1-placeIdx], dB=b[digits-1-placeIdx];
  var pv=Math.pow(10,placeIdx); // 1, 10, 100
  var vA=dA*pv, vB=dB*pv;

  var qText;
  if(placeIdx===2) qText='竖式中，百位上是几百加几百？';
  else if(placeIdx===1) qText='竖式中，十位上是几十加几十？';
  else qText='竖式中，个位上是几加几？';

  var correctOpt=vA+' + '+vB;
  var opts=[correctOpt];

  // 生成3个干扰项
  var attempts2=0;
  while(opts.length<4 && attempts2<50){ attempts2++;
    var wv;
    if(Math.random()<0.5) wv=(dA+randInt(-2,2))*pv;
    else wv=dA*pv;
    var wv2;
    if(Math.random()<0.5) wv2=(dB+randInt(-2,2))*pv;
    else wv2=dB*pv;
    if(wv<0)wv=Math.abs(wv); if(wv2<0)wv2=Math.abs(wv2);
    if(wv%pv!==0)wv=Math.round(wv/pv)*pv;
    if(wv2%pv!==0)wv2=Math.round(wv2/pv)*pv;
    if(wv<0)wv=0; if(wv2<0)wv2=0;
    if(wv>900)wv=900; if(wv2>900)wv2=900;
    var candidate=wv+' + '+wv2;
    if(candidate!==correctOpt && opts.indexOf(candidate)<0) opts.push(candidate);
  }
  // 如果还不够4个，补齐
  while(opts.length<4){
    var fv=randInt(1,9)*pv, fv2=randInt(1,9)*pv;
    var fill=fv+' + '+fv2;
    if(fill!==correctOpt && opts.indexOf(fill)<0) opts.push(fill);
  }

  return {
    type:'m2', tag:'不进位加法',
    q:qText, o:opts.slice(0,4), a:0, module:2,
    n1:n1, n2:n2, sum:sum, digits:digits
  };
}

// M3: 进位加法 + 计数器（偶尔4位）
function genM3() {
  var digits=randInt(2,3);
  // 约30%概率出4位计数器题目（总和接近1000）
  var use4Digit=Math.random()<0.3;
  var a=[],b=[];
  var carryPositions=[];
  var ok=false; var n1,n2,sum; var safety=0;
  while(!ok && safety<80){ safety++;
    a=[];b=[];carryPositions=[];
    for(var i=0;i<digits;i++){
      var d1=randInt(2,8);
      var d2=randInt(10-d1,9);
      if(i===0 && Math.random()<0.4){d1=randInt(1,9);d2=randInt(1,9);}
      if(d1+d2>=10) carryPositions.push(i);
      a.push(d1); b.push(d2);
    }
    if(carryPositions.length===0){
      var pi=randInt(0,digits-1);
      a[pi]=randInt(5,9); b[pi]=randInt(10-a[pi],9);
    }
    // 4位计数器：用三位数加法，和接近1000
    if(use4Digit && digits===3){
      a[0]=randInt(4,6);a[1]=randInt(0,9);a[2]=randInt(0,9);
      b[0]=randInt(3,9-a[0]);b[1]=randInt(0,9);b[2]=randInt(0,9);
    }
    n1=parseInt(a.join('')); n2=parseInt(b.join(''));
    sum=n1+n2;
    if(sum<=1000) ok=true;
  }
  var counterCols=use4Digit?4:3;

  return {
    type:'m3', tag:'进位加法'+(use4Digit?'(千位)':''),
    q:'请用计数器计算：'+n1+' + '+n2+' = ？\n（先拨出'+n1+'，再逐位加上'+n2+'）',
    o:genNumOpts(sum), a:0, module:3,
    n1:n1, n2:n2, sum:sum, counterCols:counterCols
  };
}

// M4: 连加竖式 + 实际问题（总和<=1000）
function genM4() {
  var ctx=pick([
    '小明买文具：铅笔{1}元，橡皮{2}元，笔记本{3}元，一共多少元？',
    '图书馆借书：上午{1}本，中午{2}本，下午{3}本，一共多少本？',
    '运动会得分：跳远{1}分，跑步{2}分，跳绳{3}分，总分多少？',
    '水果店：苹果{1}个，橘子{2}个，梨{3}个，一共多少个？'
  ]);
  var n1,n2,n3,total; var ok=false; var safety=0;
  while(!ok && safety<30){ safety++;
    n1=randInt(10,39)*10+randInt(1,9);
    n2=randInt(10,39)*10+randInt(1,9);
    n3=randInt(10,39)*10+randInt(1,9);
    total=n1+n2+n3;
    if(total<=1000) ok=true;
  }
  var qText=ctx.replace('{1}',n1).replace('{2}',n2).replace('{3}',n3);
  return {
    type:'m4', tag:'连加竖式',
    q:qText, o:genNumOpts(total), a:0, module:4,
    n1:n1, n2:n2, n3:n3, total:total
  };
}

// M5: 不退位减法
function genM5() {
  var digits=randInt(2,3);
  var a=[],b=[];
  for(var i=0;i<digits;i++){
    var d1=randInt(3,9);
    var d2=randInt(0,d1-1); // 确保不退位
    if(i===0){d1=randInt(2,9);d2=randInt(1,d1-1);}
    a.push(d1); b.push(d2);
  }
  var n1=parseInt(a.join('')); var n2=parseInt(b.join(''));
  if(n2===0){b[digits-1]=1;n2=parseInt(b.join(''));}
  var diff=n1-n2;

  return {
    type:'m5', tag:'不退位减法',
    q:'用竖式计算：'+n1+' − '+n2+' = ？', o:genNumOpts(diff), a:0, module:5,
    n1:n1, n2:n2, diff:diff, digits:digits
  };
}

// M6: 退位减法
function genM6() {
  var digits=randInt(2,3);
  var a=[],b=[];
  var borrowPositions=[];
  for(var i=0;i<digits;i++){
    var d1=randInt(2,9);
    var d2=randInt(1,9);
    if(i===0){d1=randInt(3,9);d2=randInt(1,8);}
    if(d2>d1) borrowPositions.push(i);
    a.push(d1); b.push(d2);
  }
  if(borrowPositions.length===0){
    var pi=randInt(0,digits-1);
    a[pi]=randInt(2,8); b[pi]=randInt(a[pi]+1,9);
    if(pi>0 && a[pi-1]===0) a[pi-1]=randInt(2,9);
  }
  // 确保被减数大于减数
  var n1=parseInt(a.join('')); var n2=parseInt(b.join(''));
  if(n1<=n2){var t=a[0];a[0]+=randInt(2,4);n1=parseInt(a.join(''));}
  var diff=n1-n2;

  return {
    type:'m6', tag:'退位减法',
    q:'用竖式计算：'+n1+' − '+n2+' = ？\n（注意：需要退位！）', o:genNumOpts(diff), a:0, module:6,
    n1:n1, n2:n2, diff:diff, digits:digits
  };
}

function genNumOpts(correct) {
  var opts=[correct];
  var range=Math.max(20,Math.floor(correct*0.3));
  var attempts=0;
  while(opts.length<4 && attempts<80){
    attempts++;
    var w=correct+randInt(-range,range);
    if(w!==correct && w>=0 && w<=9999 && opts.indexOf(w)<0) opts.push(w);
  }
  for(var i=1;i<=4&&opts.length<4;i++){if(opts.indexOf(correct+i)<0)opts.push(correct+i);if(opts.length>=4)break;if(opts.indexOf(correct-i)<0&&correct-i>=0)opts.push(correct-i);}
  return opts;
}

function generateRound() {
  if(curModule===1) return genM1();
  if(curModule===2) return genM2();
  if(curModule===3) return genM3();
  if(curModule===4) return genM4();
  if(curModule===5) return genM5();
  if(curModule===6) return genM6();
  // 综合：单数轮=M1-M3(加法), 双数轮=M4-M6(减法/连加)
  var seq=[genM1,genM1,genM2,genM3,genM4,genM5,genM5,genM6,genM2,genM6];
  return seq[cr%10]();
}

// ==================== 渲染 ====================
function clearUI(pn){
  document.getElementById('q'+pn).textContent='';
  document.getElementById('da'+pn).innerHTML='';
  document.getElementById('da'+pn).style.display='none';
  document.getElementById('op'+pn).innerHTML='';
  document.getElementById('op'+pn).style.display='none';
  document.getElementById('fb'+pn).textContent='';
  hideCounter(pn);
}

function renderQuestion(pn, rd){
  var qEl=document.getElementById('q'+pn);
  var daEl=document.getElementById('da'+pn);
  var opEl=document.getElementById('op'+pn);

  // 显示模块标签
  var modColors={1:'#FF6B6B',2:'#4ECDC4',3:'#FF9800',4:'#6C5CE7',5:'#42A5F5',6:'#EC407A'};
  var mc=modColors[rd.module]||'#aaa';
  qEl.innerHTML='<span style="display:inline-block;padding:1px 7px;border-radius:8px;font-size:0.65em;font-weight:bold;background:'+mc+';color:#fff;margin-right:4px">'+rd.tag+'</span>'+rd.q.replace(/\n/g,'<br>');

  // 渲染竖式展示
  if(rd.type==='m2'&&rd.n1){
    daEl.style.display='block';
    daEl.innerHTML=formatVertCalcWithPlace(rd.n1, rd.n2, rd.sum);
  } else if(rd.type==='m4'&&rd.n1){
    daEl.style.display='block';
    daEl.innerHTML=formatMultiAdd(rd.n1, rd.n2, rd.n3, rd.total);
  } else if((rd.type==='m5'||rd.type==='m6')&&rd.n1){
    daEl.style.display='block';
    daEl.innerHTML=formatSubCalc(rd.n1, rd.n2, rd.diff);
  } else {
    daEl.style.display='none';
  }

  // 渲染计数器（仅M3）
  if(rd.type==='m3'){
    setCounter(pn, rd.n1, rd.counterCols||3);
  } else {
    hideCounter(pn);
  }

  // 渲染选项
  var opts=sf([0,1,2,3]);
  var labels=['A','B','C','D'];
  var h='';
  for(var i=0;i<4;i++){
    var oi=opts[i];
    h+='<button class="p-opt" onclick="answer('+pn+','+oi+','+rd.a+',this)" id="ob'+pn+'_'+i+'">'+labels[i]+'. '+rd.o[oi]+'</button>';
  }
  opEl.innerHTML=h;
  opEl.style.display='grid';
}

// ==================== 游戏流程 ====================
function setModule(mod){
  curModule=mod;
  var tabs=document.querySelectorAll('#modTabs .mod-tab');
  tabs.forEach(function(t,i){t.classList.toggle('active',i===mod);});
  restartGame();
}

function startGame(){
  initAudio();
  document.getElementById('btnStart').style.display='none';
  go=true; sc=[0,0]; cr=0; ans=[false,false];
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  document.getElementById('winOverlay').classList.remove('show');
  nextRound();
}

function nextRound(){
  if(cr>=tr){endGame();return;}
  ans=[false,false];
  document.getElementById('rn').textContent=cr+1;
  roundData=generateRound();
  clearUI(1); clearUI(2);
  counterVals={1:[0,0,0],2:[0,0,0]};
  renderQuestion(1, roundData);
  renderQuestion(2, roundData);
  tm=roundData.type==='m3'?25:18;
  document.getElementById('tm').textContent=tm;
  clearInterval(ti);
  ti=setInterval(function(){
    tm--;
    document.getElementById('tm').textContent=tm;
    if(tm<=5)sfxTick();
    if(tm<=0){clearInterval(ti);timeUp();}
  },1000);
}

function answer(pn,oi,ai,btn){
  if(!go||ans[pn-1])return;
  ans[pn-1]=true;
  var bs=document.querySelectorAll('#op'+pn+' .p-opt');
  bs.forEach(function(b){b.disabled=true;});
  if(oi===ai){
    btn.classList.add('correct');
    sc[pn-1]+=10;
    document.getElementById('s'+pn).textContent=sc[pn-1];
    document.getElementById('fb'+pn).innerHTML='✅ 正确！+10';
    document.getElementById('st'+pn).textContent='🔥';
    sfxCorrect();
  } else {
    btn.classList.add('wrong');
    document.getElementById('fb'+pn).innerHTML='❌ 答错了';
    document.getElementById('st'+pn).textContent='';
    sfxWrong();
    var correctText=roundData.o[ai];
    for(var i=0;i<bs.length;i++){
      var t=bs[i].textContent.replace(/^[A-D]\.\s*/,'');
      if(t===correctText){bs[i].classList.add('correct');break;}
    }
  }
  if(ans[0]&&ans[1]){clearInterval(ti);cr++;setTimeout(function(){nextRound();},1200);}
}

function timeUp(){
  for(var p=1;p<=2;p++){
    if(!ans[p-1]){
      var bs=document.querySelectorAll('#op'+p+' .p-opt');
      bs.forEach(function(b){b.disabled=true;});
      document.getElementById('fb'+p).innerHTML='⏰ 时间到！';
    }
  }
  cr++;
  setTimeout(function(){nextRound();},1200);
}

function endGame(){
  go=false; clearInterval(ti);
  document.getElementById('winOverlay').classList.add('show');
  document.getElementById('ws1').textContent=sc[0];
  document.getElementById('ws2').textContent=sc[1];
  if(sc[0]>sc[1]){
    document.getElementById('winTitle').innerHTML='🔴 红方获胜！';
    document.getElementById('winTitle').style.color='#FF6B6B';
    document.getElementById('winSub').textContent='红方 '+sc[0]+' : '+sc[1]+' 蓝方';
    sfxWin();
  } else if(sc[1]>sc[0]){
    document.getElementById('winTitle').innerHTML='🔵 蓝方获胜！';
    document.getElementById('winTitle').style.color='#4ECDC4';
    document.getElementById('winSub').textContent='蓝方 '+sc[1]+' : '+sc[0]+' 红方';
    sfxWin();
  } else {
    document.getElementById('winTitle').innerHTML='🤝 平局！';
    document.getElementById('winTitle').style.color='#FFD700';
    document.getElementById('winSub').textContent='双方都是 '+sc[0]+' 分';
    playTone(523,0.3,'sine',0.05);
  }
  spawnConfetti();
  var best=parseInt(localStorage.getItem(sk)||'0');
  var mx=Math.max(sc[0],sc[1]);
  if(mx>best){localStorage.setItem(sk,mx);}
}

function spawnConfetti(){
  var colors=['#FF6B6B','#4ECDC4','#FFD700','#FF9800','#6C5CE7','#66BB6A','#EC407A','#42A5F5'];
  for(var i=0;i<50;i++){
    var d=document.createElement('div');
    d.className='confetti';
    d.style.left=Math.random()*100+'%';
    d.style.top=-(Math.random()*40+8)+'px';
    d.style.width=(Math.random()*8+5)+'px';
    d.style.height=(Math.random()*8+5)+'px';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(Math.random()*2+1.5)+'s';
    d.style.animationDelay=Math.random()*1.2+'s';
    d.style.borderRadius=Math.random()>0.5?'50%':'0';
    document.body.appendChild(d);
    setTimeout(function(){d.remove();},3500);
  }
}

function restartGame(){
  clearInterval(ti); go=false;
  sc=[0,0]; cr=0; ans=[false,false];
  counterVals={1:[0,0,0],2:[0,0,0]};
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  clearUI(1); clearUI(2);
  document.getElementById('q1').textContent='准备开始...';
  document.getElementById('q2').textContent='准备开始...';
  document.getElementById('fb1').textContent='';
  document.getElementById('fb2').textContent='';
  document.getElementById('st1').textContent='';
  document.getElementById('st2').textContent='';
  document.getElementById('rn').textContent='1';
  document.getElementById('tm').textContent='20';
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('btnStart').style.display='inline-block';
  roundData=null;
  var cf=document.querySelectorAll('.confetti');
  cf.forEach(function(c){c.remove();});
}
