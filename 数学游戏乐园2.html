var cg_=0, cs_=0, ts=0, cc=0;
function gk(f){return 'pk_'+f.replace(/[\/\.\s]/g,'_').replace(/^_+|_+$/g,'');}
function init(){buildTabs();ls();ru();}
function buildTabs(){
  var h='';DATA.forEach(function(g,i){h+='<button class="tab g'+i+(i===0?' active':'')+'" onclick="swg('+i+')">'+g.icon+' '+g.name+'</button>';});
  document.getElementById('gtabs').innerHTML=h;
  buildSemTabs();
}
function buildSemTabs(){
  var h='';DATA[cg_].sem.forEach(function(s,j){h+='<button class="semtab '+(j===0?'up':'dn')+(j===cs_?' active':'')+'" onclick="sws('+j+')">📘 '+s.name+'</button>';});
  document.getElementById('stabs').innerHTML=h;
}
function swg(i){cg_=i;cs_=0;buildSemTabs();document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('active',j===i);});ru();}
function sws(i){cs_=i;document.querySelectorAll('.semtab').forEach(function(t,j){t.classList.toggle('active',j===i);});ru();}
function ls(){ts=0;cc=0;DATA.forEach(function(g){g.sem.forEach(function(s){s.units.forEach(function(u){u.g.forEach(function(x){var k=gk(x[1]);var v=parseInt(localStorage.getItem(k)||'0');x[2]=v;if(v>0){ts+=v;cc++;}});});});});us();}
function rc(){ls();}
function us(){document.getElementById('ts').textContent=ts;document.getElementById('cc').textContent=cc;}
function ru(){
  var units=DATA[cg_].sem[cs_].units;var h='';var n=0;
  units.forEach(function(u){n++;
    h+='<div class="card">';
    h+='<span class="ui">'+u.i+'</span>';
    h+='<div class="ch"><div class="cn">'+n+'</div><div class="un">'+u.nn+'</div></div>';
    h+='<div class="ud">'+u.d+'</div>';
    h+='<div class="gl">';
    u.g.forEach(function(x){var sh='',st=x[2]||0;for(var i=0;i<3;i++)sh+='<span class="'+(i<st?'e':'em')+'">'+(i<st?'⭐':'☆')+'</span>';h+='<button class="gl-btn" onclick="og(\''+eh(x[1])+'\',\''+eh(x[0])+'\')">⚔ '+x[0]+' <span class="star-badge">'+sh+'</span></button>';});
    h+='</div></div>';
  });
  document.getElementById('ca').innerHTML=h;
}
function eh(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function og(f,t){
  var m=document.getElementById('gm');document.getElementById('mt').textContent=t;
  document.getElementById('gf').src=f;m.classList.add('open');document.body.style.overflow='hidden';
  var k=gk(f);clearTimeout(document.getElementById('gf')._st);
  document.getElementById('gf')._st=setTimeout(function(){var c=parseInt(localStorage.getItem(k)||'0');if(c<3){localStorage.setItem(k,c+1);rc();ru();}},45000);
}
function cg(){var m=document.getElementById('gm');m.classList.remove('open');document.body.style.overflow='';setTimeout(function(){document.getElementById('gf').src='';},350);}
function rsa(){if(confirm('确定要重置所有PK记录吗？')){var ks=[];for(var k in localStorage)if(k.indexOf('pk_')===0)ks.push(k);ks.forEach(function(k){localStorage.removeItem(k);});rc();ru();}}
function openSponsor(){document.getElementById('spm').classList.add('open');}
function closeSponsor(){document.getElementById('spm').classList.remove('open');}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){cg();closeSponsor();}});
document.getElementById('gm').addEventListener('click',function(e){if(e.target===this)cg();});
document.getElementById('spm').addEventListener('click',function(e){if(e.target===this)closeSponsor();});
init();
</script>
