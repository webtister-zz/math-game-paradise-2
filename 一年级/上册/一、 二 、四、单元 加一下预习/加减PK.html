<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>加减PK - 掉落数字对战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;color:#fff}

/* === 模块选择画面 === */
.module-screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;background:linear-gradient(180deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.module-screen.hidden{display:none}
.module-screen h2{font-size:2em;background:linear-gradient(135deg,#FFD700,#FF6B6B,#4ECDC4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.module-screen .subtitle{color:rgba(255,255,255,0.5);font-size:0.9em;margin-bottom:10px}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;max-width:700px;width:90%}
.mod-btn{padding:20px 16px;border-radius:18px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;font-size:1em;font-weight:bold;cursor:pointer;transition:all 0.3s;font-family:inherit;text-align:center;line-height:1.5}
.mod-btn:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,0.4)}
.mod-btn:nth-child(1):hover{background:rgba(76,175,80,0.3);border-color:#4CAF50}
.mod-btn:nth-child(2):hover{background:rgba(33,150,243,0.3);border-color:#2196F3}
.mod-btn:nth-child(3):hover{background:rgba(255,152,0,0.3);border-color:#FF9800}
.mod-btn:nth-child(4):hover{background:rgba(156,39,176,0.3);border-color:#9C27B0}
.mod-btn:nth-child(5):hover{background:rgba(244,67,54,0.3);border-color:#F44336}
.mod-btn .mod-icon{font-size:2em;display:block;margin-bottom:6px}
.mod-btn .mod-label{font-size:1.1em}
.mod-btn .mod-range{font-size:0.75em;color:rgba(255,255,255,0.45);margin-top:4px}
.home-btn-top{padding:10px 28px;border-radius:22px;border:2px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.6);font-size:0.9em;cursor:pointer;font-family:inherit;transition:all 0.25s;margin-top:8px}
.home-btn-top:hover{border-color:#FFD700;color:#FFD700}

/* === 游戏画面 === */
.game-screen{width:100%;height:100vh;display:flex;flex-direction:column}
.game-screen.hidden{display:none}

.top-bar{display:flex;align-items:center;justify-content:center;padding:8px 12px;gap:10px;background:rgba(0,0,0,0.5);flex-shrink:0;flex-wrap:wrap;z-index:10}
.top-bar h1{font-size:1.15em;background:linear-gradient(90deg,#FFD700,#FF6B6B,#4ECDC4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.module-badge{padding:4px 12px;border-radius:12px;font-size:0.75em;font-weight:bold;white-space:nowrap}
.module-badge.m1{background:rgba(76,175,80,0.3);color:#4CAF50}
.module-badge.m2{background:rgba(33,150,243,0.3);color:#64B5F6}
.module-badge.m3{background:rgba(255,152,0,0.3);color:#FFB74D}
.module-badge.m4{background:rgba(156,39,176,0.3);color:#CE93D8}
.module-badge.m5{background:rgba(244,67,54,0.3);color:#EF9A9A}
.timer{font-size:1.5em;font-weight:bold;color:#FFD700;min-width:55px;text-align:center}
.round-info{font-size:0.82em;color:#aaa;white-space:nowrap}

.question-bar{text-align:center;padding:8px;background:rgba(255,255,255,0.04);flex-shrink:0;z-index:10}
.question-text{font-size:1.3em;font-weight:bold;color:#fff;display:inline-block;padding:8px 24px;background:rgba(255,255,255,0.08);border-radius:20px;border:1px solid rgba(255,255,255,0.1)}

.arena{flex:1;display:flex;position:relative;min-height:0;overflow:hidden}
.player-zone{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.player-zone.red{background:linear-gradient(180deg,rgba(255,107,107,0.12),rgba(0,0,0,0.2));border-right:3px solid #FF6B6B}
.player-zone.blue{background:linear-gradient(180deg,rgba(78,205,196,0.12),rgba(0,0,0,0.2));border-left:3px solid #4ECDC4}

.pz-header{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none}
.pz-name{font-size:0.95em;font-weight:bold;padding:3px 12px;border-radius:10px;background:rgba(0,0,0,0.5)}
.red .pz-name{color:#FF6B6B}
.blue .pz-name{color:#4ECDC4}
.pz-score{font-size:1.6em;font-weight:bold;padding:2px 10px;border-radius:10px;background:rgba(0,0,0,0.5)}
.red .pz-score{color:#FF6B6B}
.blue .pz-score{color:#4ECDC4}
.pz-feedback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.4em;font-weight:bold;z-index:6;pointer-events:none;transition:all 0.3s;opacity:0}
.pz-feedback.show{opacity:1;animation:fbPop 0.8s ease-out forwards}
@keyframes fbPop{0%{transform:translate(-50%,-50%)scale(0.5);opacity:0}30%{transform:translate(-50%,-50%)scale(1.3);opacity:1}100%{transform:translate(-50%,-50%)scale(1);opacity:0}}

/* === 掉落数字 === */
.falling-num{position:absolute;border-radius:50%;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;transition:outline 0.1s,box-shadow 0.1s,border-color 0.1s;animation:fallDown linear forwards;text-shadow:0 2px 10px rgba(0,0,0,0.6);border:4px solid rgba(255,255,255,0.5);pointer-events:auto;touch-action:manipulation;will-change:transform}
.falling-num:hover{outline:5px solid #fff;outline-offset:4px;border-color:#FFD700;box-shadow:0 0 35px rgba(255,215,0,0.9);z-index:50}
.falling-num:active{filter:brightness(1.4)}
.falling-num.correct-pick{background:#10B981!important;border-color:#fff!important;animation:popBubble 0.5s ease-out forwards!important;z-index:60!important;pointer-events:none}
.falling-num.wrong-pick{background:#EF4444!important;border-color:#fff!important;animation:shakeBubble 0.4s ease-out forwards!important;pointer-events:none}
@keyframes fallDown{0%{transform:translateY(-130px);opacity:1}75%{opacity:1}100%{transform:translateY(calc(100vh));opacity:0.2}}
@keyframes popBubble{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}
@keyframes shakeBubble{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

.vs-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.2em;font-weight:bold;z-index:10;text-shadow:0 0 30px rgba(255,215,0,0.8);pointer-events:none;animation:vsPulse 2s infinite}
@keyframes vsPulse{0%,100%{opacity:0.5;transform:translate(-50%,-50%)scale(1)}50%{opacity:1;transform:translate(-50%,-50%)scale(1.15)}}

.ready-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.3em;color:rgba(255,255,255,0.4);pointer-events:none;z-index:2}

.bottom-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px;background:rgba(0,0,0,0.5);flex-shrink:0;flex-wrap:wrap;z-index:10}
.ctrl-btn{padding:9px 20px;border-radius:20px;border:none;font-size:0.88em;font-weight:bold;cursor:pointer;font-family:inherit;transition:all 0.2s}
.ctrl-btn.start{background:linear-gradient(135deg,#FFD700,#FF9800);color:#333}
.ctrl-btn.home{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.ctrl-btn.restart{background:linear-gradient(135deg,#FF6B6B,#ee5a5a);color:#fff}
.ctrl-btn.music{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.ctrl-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,0.3)}

/* === 结束弹窗 === */
.win-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column}
.win-overlay.show{display:flex}
.win-title{font-size:2.2em;font-weight:bold;margin-bottom:8px;animation:bounceIn 0.6s}
.win-subtitle{font-size:1.1em;color:#ccc;margin-bottom:16px}
.win-scores{display:flex;gap:36px;margin-bottom:18px}
.win-player{text-align:center}
.win-player .wscore{font-size:2.8em;font-weight:bold}
.win-player.left-w .wscore{color:#FF6B6B}
.win-player.right-w .wscore{color:#4ECDC4}
@keyframes bounceIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.win-btns{display:flex;gap:12px}
.confetti{position:fixed;pointer-events:none;z-index:101;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-100px)rotate(0);opacity:1}100%{transform:translateY(105vh)rotate(720deg);opacity:0}}

@media(max-width:700px){
  .arena{flex-direction:column}
  .player-zone.red{border-right:none;border-bottom:3px solid #FF6B6B}
  .player-zone.blue{border-left:none;border-top:3px solid #4ECDC4}
  .vs-badge{font-size:1.4em}
  .question-text{font-size:1.1em}
  .modules-grid{grid-template-columns:1fr 1fr}
  .module-screen h2{font-size:1.4em}
  .win-title{font-size:1.5em}
}
</style>
</head>
<body>

<!-- 模块选择画面 -->
<div class="module-screen" id="moduleScreen">
  <h2>⚔️ 加减PK对战</h2>
  <div class="subtitle">选择一个计算模块开始对战</div>
  <div class="modules-grid">
    <button class="mod-btn" onclick="selectModule(1)">
      <span class="mod-icon">🌱</span>
      <span class="mod-label">5以内的加减</span>
      <span class="mod-range">1~5 · 基础入门</span>
    </button>
    <button class="mod-btn" onclick="selectModule(2)">
      <span class="mod-icon">🌿</span>
      <span class="mod-label">6~9的加减</span>
      <span class="mod-range">6~9 · 稳步提升</span>
    </button>
    <button class="mod-btn" onclick="selectModule(3)">
      <span class="mod-icon">🌳</span>
      <span class="mod-label">10的加减</span>
      <span class="mod-range">10以内 · 熟练运算</span>
    </button>
    <button class="mod-btn" onclick="selectModule(4)">
      <span class="mod-icon">🏔️</span>
      <span class="mod-label">20以内加减</span>
      <span class="mod-range">11~20 · 进位退位</span>
    </button>
    <button class="mod-btn" onclick="selectModule(5)">
      <span class="mod-icon">🔥</span>
      <span class="mod-label">连加连减混合</span>
      <span class="mod-range">综合运算 · 挑战王者</span>
    </button>
  </div>
  <button class="home-btn-top" onclick="goHome()">🏠 返回主页</button>
</div>

<!-- 游戏画面 -->
<div class="game-screen hidden" id="gameScreen">
  <div class="top-bar">
    <h1 id="gameTitle">加减PK ⚔️</h1>
    <span class="module-badge m1" id="modBadge">5以内</span>
    <span class="round-info">第 <span id="rn">1</span>/<span id="tr">10</span> 轮</span>
    <span class="timer">⏱ <span id="tm">15</span>s</span>
  </div>
  <div class="question-bar">
    <div class="question-text" id="question">准备开始...</div>
  </div>
  <div class="arena">
    <div class="player-zone red" id="zone1">
      <div class="pz-header"><span class="pz-name">🔴 红方</span><span class="pz-score" id="s1">0</span></div>
      <div class="ready-text" id="ready1">准备...</div>
      <div class="pz-feedback" id="fb1"></div>
    </div>
    <div class="vs-badge">⚡VS⚡</div>
    <div class="player-zone blue" id="zone2">
      <div class="pz-header"><span class="pz-name">🔵 蓝方</span><span class="pz-score" id="s2">0</span></div>
      <div class="ready-text" id="ready2">准备...</div>
      <div class="pz-feedback" id="fb2"></div>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="ctrl-btn start" id="btnStart" onclick="startGame()">⚔️ 开始对战</button>
    <button class="ctrl-btn home" onclick="backToModules()">📋 选择模块</button>
    <button class="ctrl-btn music" id="btnMusic" onclick="toggleMusic()">🔊 音乐</button>
    <button class="ctrl-btn restart" onclick="restartGame()">🔄 重新开始</button>
  </div>
</div>

<!-- 结束弹窗 -->
<div class="win-overlay" id="winOverlay">
  <div class="win-title" id="winTitle"></div>
  <div class="win-subtitle" id="winSub"></div>
  <div class="win-scores">
    <div class="win-player left-w"><div style="color:#FF6B6B">🔴 红方</div><div class="wscore" id="ws1">0</div></div>
    <div class="win-player right-w"><div style="color:#4ECDC4">🔵 蓝方</div><div class="wscore" id="ws2">0</div></div>
  </div>
  <div class="win-btns">
    <button class="ctrl-btn restart" onclick="restartGame()" style="font-size:1.1em;padding:12px 28px">🔄 再来一局</button>
    <button class="ctrl-btn home" onclick="backToModules()" style="font-size:1.1em;padding:12px 28px">📋 选择模块</button>
  </div>
</div>

<script>
// ============ 题库：5个模块，每个15题 ============
var QBANK = {
  1: { // 5以内的加减
    name: '5以内的加减', cls:'m1',
    qs:[
      {q:'1+1=?', a:2}, {q:'2+1=?', a:3}, {q:'3-1=?', a:2}, {q:'4-2=?', a:2},
      {q:'1+3=?', a:4}, {q:'5-3=?', a:2}, {q:'2+2=?', a:4}, {q:'5-1=?', a:4},
      {q:'3-2=?', a:1}, {q:'1+2=?', a:3}, {q:'4-1=?', a:3}, {q:'0+5=?', a:5},
      {q:'3-0=?', a:3}, {q:'2+3=?', a:5}, {q:'5-4=?', a:1}
    ]
  },
  2: { // 6~9的加减
    name: '6~9的加减', cls:'m2',
    qs:[
      {q:'3+3=?', a:6}, {q:'4+2=?', a:6}, {q:'7-2=?', a:5}, {q:'8-3=?', a:5},
      {q:'2+5=?', a:7}, {q:'9-4=?', a:5}, {q:'3+4=?', a:7}, {q:'6-2=?', a:4},
      {q:'4+3=?', a:7}, {q:'8-5=?', a:3}, {q:'5+3=?', a:8}, {q:'9-6=?', a:3},
      {q:'6+2=?', a:8}, {q:'7-4=?', a:3}, {q:'4+4=?', a:8}
    ]
  },
  3: { // 10的加减
    name: '10的加减', cls:'m3',
    qs:[
      {q:'5+5=?', a:10}, {q:'10-3=?', a:7}, {q:'6+4=?', a:10}, {q:'10-7=?', a:3},
      {q:'3+7=?', a:10}, {q:'10-2=?', a:8}, {q:'2+8=?', a:10}, {q:'10-6=?', a:4},
      {q:'1+9=?', a:10}, {q:'10-9=?', a:1}, {q:'9+1=?', a:10}, {q:'10-4=?', a:6},
      {q:'8+2=?', a:10}, {q:'10-1=?', a:9}, {q:'7+3=?', a:10}
    ]
  },
  4: { // 20以内加减
    name: '20以内加减', cls:'m4',
    qs:[
      {q:'8+5=?', a:13}, {q:'15-7=?', a:8}, {q:'9+6=?', a:15}, {q:'13-6=?', a:7},
      {q:'7+8=?', a:15}, {q:'16-9=?', a:7}, {q:'6+7=?', a:13}, {q:'14-8=?', a:6},
      {q:'9+4=?', a:13}, {q:'17-9=?', a:8}, {q:'5+9=?', a:14}, {q:'11-4=?', a:7},
      {q:'8+7=?', a:15}, {q:'18-9=?', a:9}, {q:'9+9=?', a:18}
    ]
  },
  5: { // 连加连减混合
    name: '连加连减混合', cls:'m5',
    qs:[
      {q:'2+3+1=?', a:6}, {q:'5-2-1=?', a:2}, {q:'3+1+4=?', a:8}, {q:'8-3-2=?', a:3},
      {q:'1+2+3=?', a:6}, {q:'9-4-3=?', a:2}, {q:'4+2+3=?', a:9}, {q:'10-5-2=?', a:3},
      {q:'2+4+1=?', a:7}, {q:'7-3-1=?', a:3}, {q:'5+3-2=?', a:6}, {q:'4-1+3=?', a:6},
      {q:'6-3+2=?', a:5}, {q:'3+2-4=?', a:1}, {q:'8-5+3=?', a:6}
    ]
  }
};

var curMod=1, fQ=[], sc=[0,0], cr=0, tr=10, tm=15;
var ti=null, go=false, ans=[false,false];
var sk='pk_'+window.location.pathname.replace(/[\/\.\s]/g,'_').replace(/^_+|_+$/g,'');
var musicOn=true, actx=null;
var fallTimers=[[],[]]; // track falling animation cleanup

function sf(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}

function initAudio(){if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();}}
function playTone(f,d,ty,vol){if(!musicOn||!actx)return;try{var o=actx.createOscillator();var g=actx.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,actx.currentTime);g.gain.setValueAtTime(vol||0.1,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
function sfxCorrect(){playTone(523,0.12,'square',0.08);setTimeout(function(){playTone(659,0.12,'square',0.08);},80);setTimeout(function(){playTone(784,0.18,'square',0.08);},160);}
function sfxWrong(){playTone(200,0.25,'sawtooth',0.06);}
function sfxWin(){for(var i=0;i<5;i++){setTimeout(function(){playTone(523+Math.random()*500,0.18,'square',0.07);},i*130);}}
function sfxTick(){playTone(800,0.04,'sine',0.04);}
function sfxPop(){playTone(600,0.08,'sine',0.05);}
function toggleMusic(){initAudio();musicOn=!musicOn;document.getElementById('btnMusic').textContent=musicOn?'🔊 音乐':'🔇 静音';if(musicOn){playTone(440,0.1,'sine',0.05);}}

function goHome(){window.location.href='../index.html';}

// ============ 模块选择 ============
function selectModule(m){
  curMod=m; var info=QBANK[m];
  document.getElementById('moduleScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('gameTitle').textContent='加减PK ⚔️ '+info.name;
  var badge=document.getElementById('modBadge');
  badge.textContent=info.name; badge.className='module-badge '+info.cls;
  fQ=sf(info.qs.slice()); tr=Math.min(10,fQ.length);
  document.getElementById('tr').textContent=tr;
  restartGame();
}

function backToModules(){
  clearInterval(ti); go=false;
  clearAllFalling();
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('moduleScreen').classList.remove('hidden');
  document.getElementById('winOverlay').classList.remove('show');
}

// ============ 游戏逻辑 ============
function startGame(){
  initAudio();
  document.getElementById('btnStart').style.display='none';
  var info=QBANK[curMod];
  fQ=sf(info.qs.slice()); tr=Math.min(10,fQ.length);
  document.getElementById('tr').textContent=tr;
  go=true; sc=[0,0]; cr=0; ans=[false,false];
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('ready1').style.display='';
  document.getElementById('ready2').style.display='';
  clearAllFalling();
  nextRound();
}

function nextRound(){
  if(cr>=tr){endGame();return;}
  ans=[false,false]; document.getElementById('rn').textContent=cr+1;
  var q=fQ[cr];
  document.getElementById('question').textContent='❓ '+q.q;
  document.getElementById('ready1').style.display='none';
  document.getElementById('ready2').style.display='none';
  // spawn falling numbers for both players
  spawnFalling(1,q);
  spawnFalling(2,q);
  tm=15; document.getElementById('tm').textContent=tm;
  clearInterval(ti);
  ti=setInterval(function(){
    tm--; document.getElementById('tm').textContent=tm;
    if(tm<=5)sfxTick();
    if(tm<=0){clearInterval(ti);timeUp();}
  },1000);
}

function getDistractors(correctAns, count){
  var pool=[]; var min=0, max=20;
  if(curMod===1){min=0;max=5;}
  else if(curMod===2){min=0;max=9;}
  else if(curMod===3){min=0;max=10;}
  else if(curMod===4){min=0;max=20;}
  else {min=0;max=9;}
  for(var i=min;i<=max;i++){if(i!==correctAns)pool.push(i);}
  // add more variety with numbers slightly outside range
  if(pool.length<count+3){
    for(var i=Math.max(0,correctAns-3);i<=Math.min(20,correctAns+3);i++){
      if(i!==correctAns && pool.indexOf(i)<0)pool.push(i);
    }
  }
  pool=sf(pool);
  return pool.slice(0,count);
}

function spawnFalling(pn, q){
  clearFallingZone(pn);
  var zone=document.getElementById('zone'+pn);
  var correctAns=q.a;
  var distractors=getDistractors(correctAns, 7);
  var allNums=distractors.concat([correctAns]);
  allNums=sf(allNums);
  var zoneW=zone.clientWidth||500;
  var zoneH=zone.clientHeight||500;
  var colors=[
    'linear-gradient(135deg,#FF6B6B,#ee5a5a)',
    'linear-gradient(135deg,#4ECDC4,#44b8b0)',
    'linear-gradient(135deg,#FFD93D,#f0c800)',
    'linear-gradient(135deg,#6C5CE7,#5a4bd1)',
    'linear-gradient(135deg,#FF9800,#F57C00)',
    'linear-gradient(135deg,#66BB6A,#43A047)',
    'linear-gradient(135deg,#42A5F5,#1E88E5)',
    'linear-gradient(135deg,#EC407A,#D81B60)'
  ];
  // spread positions across 3 columns, 3 rows (pick 8 of 9), wide spacing
  var positions=[];
  var cols=3, rows=3;
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      positions.push({
        left: 8+(c*40)+(Math.random()-0.5)*12,
        delay: r*0.9+c*1.6+Math.random()*0.5
      });
    }
  }
  positions=sf(positions);
  // use only first 8 positions (discard 1 randomly)

  for(var i=0;i<allNums.length;i++){
    var num=allNums[i];
    var pos=positions[i];
    var el=document.createElement('div');
    el.className='falling-num';
    el.textContent=num;
    el.setAttribute('data-num',num);
    el.setAttribute('data-player',pn);
    el.style.left=pos.left+'%';
    // bigger bubbles for easier clicking
    var size=58+Math.floor(Math.random()*18); // 58-76px
    el.style.width=size+'px';
    el.style.height=size+'px';
    el.style.fontSize=(size*0.48)+'px';
    el.style.lineHeight=size+'px';
    el.style.textAlign='center';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    // fall speed: 5-9 seconds
    el.style.animationDuration=(5+Math.random()*4)+'s';
    // stagger one by one
    el.style.animationDelay=pos.delay+'s';
    // click handler
    el.addEventListener('click',function(e){
      e.stopPropagation(); e.preventDefault();
      onNumberClick(pn, this, correctAns);
    });
    el.addEventListener('touchend',function(e){
      e.stopPropagation(); e.preventDefault();
      onNumberClick(pn, this, correctAns);
    });
    zone.appendChild(el);
    // clean up after animation ends
    var dur=parseFloat(el.style.animationDuration);
    var del=parseFloat(el.style.animationDelay);
    var removeDelay=(dur+del)*1000+600;
    var tid=setTimeout(function(){
      if(el.parentNode)el.parentNode.removeChild(el);
    }, removeDelay);
    if(!fallTimers[pn-1])fallTimers[pn-1]=[];
    fallTimers[pn-1].push(tid);
  }
}

function onNumberClick(pn, el, correctAns){
  if(!go||ans[0]||ans[1])return;
  var clickedNum=parseInt(el.getAttribute('data-num'));
  var isCorrect=(clickedNum===correctAns);
  if(isCorrect){
    ans[pn-1]=true;
    el.classList.add('correct-pick');
    sc[pn-1]+=10;
    document.getElementById('s'+pn).textContent=sc[pn-1];
    showFeedback(pn,'✅ +10','#10B981');
    sfxCorrect();
    // 抢答成功 → 立即进入下一题
    clearInterval(ti);
    clearAllFalling();
    cr++;
    setTimeout(function(){nextRound();},800);
  } else {
    el.classList.add('wrong-pick');
    sc[pn-1]=Math.max(0,sc[pn-1]-2);
    document.getElementById('s'+pn).textContent=sc[pn-1];
    showFeedback(pn,'-2','#EF4444');
    sfxWrong();
    setTimeout(function(){
      if(el.parentNode)el.parentNode.removeChild(el);
    },400);
  }
}

function showFeedback(pn, text, color){
  var fb=document.getElementById('fb'+pn);
  fb.textContent=text; fb.style.color=color;
  fb.classList.remove('show');
  void fb.offsetWidth;
  fb.classList.add('show');
}

function clearFallingZone(pn){
  var zone=document.getElementById('zone'+pn);
  var nums=zone.querySelectorAll('.falling-num');
  nums.forEach(function(el){el.remove();});
  // clear timers
  if(fallTimers[pn-1]){
    fallTimers[pn-1].forEach(function(t){clearTimeout(t);});
    fallTimers[pn-1]=[];
  }
}

function clearAllFalling(){
  clearFallingZone(1); clearFallingZone(2);
}

function timeUp(){
  for(var p=1;p<=2;p++){
    if(!ans[p-1]){
      clearFallingZone(p);
      showFeedback(p,'⏰ 时间到！','#FF9800');
    }
  }
  cr++; setTimeout(function(){nextRound();},1000);
}

function endGame(){
  go=false; clearInterval(ti); clearAllFalling();
  document.getElementById('winOverlay').classList.add('show');
  document.getElementById('ws1').textContent=sc[0];
  document.getElementById('ws2').textContent=sc[1];
  if(sc[0]>sc[1]){
    document.getElementById('winTitle').innerHTML='🔴 红方获胜！';
    document.getElementById('winTitle').style.color='#FF6B6B';
    document.getElementById('winSub').textContent='红方 '+sc[0]+' : '+sc[1]+' 蓝方';
    sfxWin();
  }else if(sc[1]>sc[0]){
    document.getElementById('winTitle').innerHTML='🔵 蓝方获胜！';
    document.getElementById('winTitle').style.color='#4ECDC4';
    document.getElementById('winSub').textContent='蓝方 '+sc[1]+' : '+sc[0]+' 红方';
    sfxWin();
  }else{
    document.getElementById('winTitle').innerHTML='🤝 平局！';
    document.getElementById('winTitle').style.color='#FFD700';
    document.getElementById('winSub').textContent='双方都是 '+sc[0]+' 分';
    playTone(523,0.3,'sine',0.08);
  }
  spawnConfetti();
  var best=parseInt(localStorage.getItem(sk)||'0');
  var mx=Math.max(sc[0],sc[1]);
  if(mx>best){localStorage.setItem(sk,mx);}
}

function spawnConfetti(){
  var colors=['#FF6B6B','#4ECDC4','#FFD700','#FF9800','#6C5CE7','#66BB6A','#EC407A','#42A5F5'];
  for(var i=0;i<50;i++){
    var d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'%';d.style.top=-(Math.random()*50+10)+'px';
    d.style.width=(Math.random()*10+6)+'px';d.style.height=(Math.random()*10+6)+'px';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(Math.random()*2+2)+'s';d.style.animationDelay=Math.random()*1.2+'s';
    d.style.borderRadius=Math.random()>0.5?'50%':'0';
    document.body.appendChild(d);
    setTimeout(function(){d.remove();},3500);
  }
}

function restartGame(){
  clearInterval(ti); go=false; sc=[0,0]; cr=0; ans=[false,false];
  document.getElementById('s1').textContent='0';document.getElementById('s2').textContent='0';
  document.getElementById('rn').textContent='1';document.getElementById('tm').textContent='15';
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('btnStart').style.display='inline-block';
  document.getElementById('question').textContent='准备开始...';
  document.getElementById('ready1').style.display='';document.getElementById('ready2').style.display='';
  clearAllFalling();
  var info=QBANK[curMod];
  fQ=sf(info.qs.slice()); tr=Math.min(10,fQ.length);
  document.getElementById('tr').textContent=tr;
  var cf=document.querySelectorAll('.confetti');cf.forEach(function(c){c.remove();});
}

// 窗口大小变化时清除掉落数字
window.addEventListener('resize',function(){if(go)clearAllFalling();});
</script>
