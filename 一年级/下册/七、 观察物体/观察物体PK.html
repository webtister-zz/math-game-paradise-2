<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>观察物体PK - PK对战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;color:#fff}
.top-bar{display:flex;align-items:center;justify-content:center;padding:8px;gap:12px;background:rgba(0,0,0,0.4);flex-wrap:wrap}
.top-bar h1{font-size:1.2em;background:linear-gradient(90deg,#FFD700,#FF6B6B,#4ECDC4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.diff-tabs{display:flex;gap:4px}
.diff-tab{padding:5px 12px;border-radius:14px;border:2px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);font-size:0.78em;font-weight:bold;cursor:pointer;transition:all 0.25s;font-family:inherit;white-space:nowrap}
.diff-tab:hover{border-color:rgba(255,255,255,0.5);color:#fff}
.diff-tab.active{border-color:transparent;color:#fff}
.diff-tab.d1.active{background:linear-gradient(135deg,#4CAF50,#66BB6A)}
.diff-tab.d2.active{background:linear-gradient(135deg,#FF9800,#F57C00)}
.diff-tab.d3.active{background:linear-gradient(135deg,#EF4444,#DC2626)}
.timer{font-size:1.5em;font-weight:bold;color:#FFD700;min-width:60px;text-align:center}
.round-info{font-size:0.85em;color:#aaa}
.arena{display:flex;flex:1;height:calc(100vh - 170px)}
.player{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 8px;position:relative;overflow-y:auto;transition:all 0.3s}
.player.left{background:linear-gradient(180deg,rgba(255,107,107,0.15),rgba(0,0,0,0.3));border-right:3px solid #FF6B6B}
.player.right{background:linear-gradient(180deg,rgba(78,205,196,0.15),rgba(0,0,0,0.3));border-left:3px solid #4ECDC4}
.player-name{font-size:1.1em;font-weight:bold;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.left .player-name{color:#FF6B6B}
.right .player-name{color:#4ECDC4}
.player-score{font-size:2em;font-weight:bold;margin:4px 0}
.left .player-score{color:#FF6B6B}
.right .player-score{color:#4ECDC4}
.streak{font-size:0.8em;color:#FFD700;min-height:20px}
.question-box{background:rgba(255,255,255,0.1);border-radius:14px;padding:14px 10px;margin:6px 0;width:100%;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;font-size:1.05em;line-height:1.4}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;margin:6px 0}
.p-opt{padding:10px 6px;border-radius:12px;border:2px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;font-size:0.85em;font-weight:bold;cursor:pointer;transition:all 0.2s;font-family:inherit;text-align:center;line-height:1.3;min-height:44px;display:flex;align-items:center;justify-content:center}
.p-opt:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.5);transform:scale(1.04)}
.p-opt:active{transform:scale(0.94)}
.p-opt.correct{background:#10B981!important;border-color:#10B981!important;animation:pop 0.4s}
.p-opt.wrong{background:#EF4444!important;border-color:#EF4444!important;animation:shake 0.4s}
.p-opt:disabled{pointer-events:none;opacity:0.5}
.left .p-opt.correct{box-shadow:0 0 20px rgba(255,107,107,0.6)}
.right .p-opt.correct{box-shadow:0 0 20px rgba(78,205,196,0.6)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{font-size:0.85em;font-weight:bold;min-height:22px;text-align:center;margin:3px 0}
.vs-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.5em;font-weight:bold;z-index:10;text-shadow:0 0 30px rgba(255,215,0,0.8);pointer-events:none;animation:vsPulse 1.5s infinite}
@keyframes vsPulse{0%,100%{opacity:0.6;transform:translate(-50%,-50%)scale(1)}50%{opacity:1;transform:translate(-50%,-50%)scale(1.1)}}
.bottom-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px;background:rgba(0,0,0,0.5);flex-wrap:wrap}
.ctrl-btn{padding:10px 22px;border-radius:20px;border:none;font-size:0.9em;font-weight:bold;cursor:pointer;font-family:inherit;transition:all 0.2s}
.ctrl-btn.start{background:linear-gradient(135deg,#FFD700,#FF9800);color:#333}
.ctrl-btn.restart{background:linear-gradient(135deg,#FF6B6B,#ee5a5a);color:#fff}
.ctrl-btn.music{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3)}
.ctrl-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.win-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column}
.win-overlay.show{display:flex}
.win-title{font-size:2.5em;font-weight:bold;margin-bottom:10px;animation:bounceIn 0.6s}
.win-subtitle{font-size:1.2em;color:#ccc;margin-bottom:20px}
.win-scores{display:flex;gap:40px;margin-bottom:20px}
.win-player{text-align:center}
.win-player .wscore{font-size:3em;font-weight:bold}
.win-player.left-w .wscore{color:#FF6B6B}
.win-player.right-w .wscore{color:#4ECDC4}
@keyframes bounceIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;pointer-events:none;z-index:101;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-100px)rotate(0);opacity:1}100%{transform:translateY(105vh)rotate(720deg);opacity:0}}
@media(max-width:600px){
  .arena{flex-direction:column;height:auto}
  .player.left{border-right:none;border-bottom:3px solid #FF6B6B}
  .player.right{border-left:none;border-top:3px solid #4ECDC4}
  .player{padding:8px 6px}
  .question-box{font-size:0.9em;min-height:40px;padding:10px}
  .p-opt{font-size:0.75em;padding:8px 4px;min-height:36px}
  .vs-badge{font-size:1.5em;top:50%}
  .player-score{font-size:1.4em}
  .win-title{font-size:1.6em}
  .options-grid{gap:4px}
}
</style>
</head>
<body>
<div class="top-bar">
  <h1>观察物体PK ⚔️ PK对战</h1>
  <div class="diff-tabs">
    <button class="diff-tab d1 active" onclick="setDiff(1)">⭐ 基础</button>
    <button class="diff-tab d2" onclick="setDiff(2)">⭐⭐ 进阶</button>
    <button class="diff-tab d3" onclick="setDiff(3)">⭐⭐⭐ 挑战</button>
  </div>
  <span class="round-info">第 <span id="rn">1</span>/<span id="tr">10</span> 轮</span>
  <span class="timer">⏱ <span id="tm">15</span>s</span>
</div>

<div class="arena">
  <div class="player left" id="p1">
    <div class="player-name">🔴 红方玩家</div>
    <div class="player-score" id="s1">0</div>
    <div class="streak" id="st1"></div>
    <div class="question-box" id="q1">准备开始...</div>
    <div class="options-grid" id="op1"></div>
    <div class="feedback" id="fb1"></div>
  </div>
  <div class="vs-badge">⚡VS⚡</div>
  <div class="player right" id="p2">
    <div class="player-name">🔵 蓝方玩家</div>
    <div class="player-score" id="s2">0</div>
    <div class="streak" id="st2"></div>
    <div class="question-box" id="q2">准备开始...</div>
    <div class="options-grid" id="op2"></div>
    <div class="feedback" id="fb2"></div>
  </div>
</div>

<div class="bottom-bar">
  <button class="ctrl-btn start" id="btnStart" onclick="startGame()">⚔️ 开始对战</button>
  <button class="ctrl-btn music" id="btnMusic" onclick="toggleMusic()">🔊 音乐</button>
  <button class="ctrl-btn restart" onclick="restartGame()">🔄 重新开始</button>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-title" id="winTitle"></div>
  <div class="win-subtitle" id="winSub"></div>
  <div class="win-scores">
    <div class="win-player left-w"><div style="color:#FF6B6B">🔴 红方</div><div class="wscore" id="ws1">0</div></div>
    <div class="win-player right-w"><div style="color:#4ECDC4">🔵 蓝方</div><div class="wscore" id="ws2">0</div></div>
  </div>
  <button class="ctrl-btn restart" onclick="restartGame()" style="font-size:1.2em;padding:14px 36px">🔄 再来一局</button>
</div>

<script>
var QALL=[
// === 基础(⭐): 单个物体观察 ===
{"q":"从前面看正方体看到什么形状？","o":["三角形","正方形","圆形","长方形"],"a":1,"d":1},
{"q":"从上面看圆柱看到什么？","o":["长方形","圆形","正方形","三角形"],"a":1,"d":1},
{"q":"从侧面看球看到什么？","o":["正方形","三角形","圆形","长方形"],"a":2,"d":1},
{"q":"从前面看长方体看到什么？","o":["一定是长方形","一定是正方形","长方形或正方形","三角形"],"a":2,"d":1},
{"q":"魔方从任何面看是什么图形？","o":["长方形","正方形","三角形","圆形"],"a":1,"d":1},
{"q":"易拉罐从侧面看是什么？","o":["圆形","长方形","正方形","三角形"],"a":1,"d":1},
{"q":"哪些物体从各方向看都是圆？","o":["正方体","长方体","球","圆柱"],"a":2,"d":1},
{"q":"从上面看正方体看到什么？","o":["三角形","正方形","圆形","长方形"],"a":1,"d":1},
{"q":"粉笔盒从前面看是什么形状？","o":["圆形","长方形","三角形","不确定"],"a":1,"d":1},
{"q":"篮球从哪个方向看都是什么形？","o":["正方形","圆形","三角形","长方形"],"a":1,"d":1},

// === 进阶(⭐⭐): 多方向对比 ===
{"q":"从不同方向看同一个物体看到的一定相同吗？","o":["一定","不一定","完全相同","绝对相同"],"a":1,"d":2},
{"q":"从上面看长方体看到什么？","o":["一定是长方形","一定是正方形","长方形或正方形","三角形"],"a":2,"d":2},
{"q":"长方体从正面看和从侧面看一定相同吗？","o":["一定相同","一定不同","可能相同","无法判断"],"a":2,"d":2},
{"q":"一个水杯从上面看是什么形状？","o":["长方形","正方形","圆形","三角形"],"a":2,"d":2},
{"q":"从正面看圆柱，当圆柱躺着时看到什么？","o":["圆形","长方形","正方形","三角形"],"a":1,"d":2},
{"q":"正方体的前面和上面看到的一样吗？","o":["一样","不一样","有时一样","不确定"],"a":0,"d":2},
{"q":"站在不同位置看讲台，看到的形状相同吗？","o":["一定相同","可能不同","一定不同","无法判断"],"a":1,"d":2},
{"q":"从正上方看一辆小汽车，最可能看到什么形状？","o":["车的侧面","车的正面","车的长方形轮廓","车底"],"a":2,"d":2},
{"q":"一本书平放在桌上，从侧面看是什么？","o":["长方形","很窄的长方形","正方形","圆形"],"a":1,"d":2},
{"q":"长方体最多能看到几个面？","o":["1个","2个","3个","4个"],"a":2,"d":2},

// === 挑战(⭐⭐⭐): 组合体与综合推理 ===
{"q":"3个正方体叠成一列，从前面看看到几个正方形？","o":["1个","2个","3个","4个"],"a":2,"d":3},
{"q":"2个正方体并排，从前面看是什么？","o":["1个正方形","2个正方形并排","2个正方形竖排","长方形"],"a":1,"d":3},
{"q":"4个正方体拼成田字形，从上面看是什么？","o":["1个大正方形","4个小正方形","长方形","十字形"],"a":0,"d":3},
{"q":"从前面看3个正方体摆成L形，能看到几个正方形？","o":["1个","2个","3个","4个"],"a":1,"d":3},
{"q":"观察物体时，淘气站在熊猫的正面，笑笑站在熊猫的右侧，他们看到的？","o":["完全相同","完全不同","有可能相同","肯定不同"],"a":3,"d":3},
{"q":"用5个正方体搭成一个十字形，从上面看是什么形状？","o":["正方形","长方形","十字形","L形"],"a":2,"d":3},
{"q":"一个物体从正面看是长方形，从上面看是圆形，这是什么？","o":["正方体","球","圆柱","长方体"],"a":2,"d":3},
{"q":"一个物体从三个方向看都是正方形，这是什么？","o":["长方体","正方体","圆柱","球"],"a":1,"d":3},
{"q":"从正面看下面是2个正方体并排，上面是1个正方体在中间，能画出什么？","o":["1个正方形","2个正方形","3个正方形（品字形）","长方形"],"a":2,"d":3},
{"q":"6个正方体排成2层3列，从前面看能看到几个正方形？","o":["3个","4个","6个","2个"],"a":2,"d":3}
];

var curDiff=1,fQ=[],sc=[0,0],cr=0,tr=10,tm=15,ti=null,go=false,ans=[false,false];
var sk='pk_'+window.location.pathname.replace(/[\/\.\s]/g,'_').replace(/^_+|_+$/g,'');
var musicOn=true,actx=null;

function sf(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function initAudio(){if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();}}
function playTone(f,d,ty,vol){if(!musicOn||!actx)return;try{var o=actx.createOscillator();var g=actx.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,actx.currentTime);g.gain.setValueAtTime(vol||0.1,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
function sfxCorrect(){playTone(523,0.15,'square',0.08);setTimeout(function(){playTone(659,0.15,'square',0.08);},100);setTimeout(function(){playTone(784,0.2,'square',0.08);},200);}
function sfxWrong(){playTone(200,0.3,'sawtooth',0.06);}
function sfxWin(){for(var i=0;i<5;i++){setTimeout(function(){playTone(523+Math.random()*500,0.2,'square',0.07);},i*150);}}
function sfxTick(){playTone(800,0.05,'sine',0.04);}
function toggleMusic(){initAudio();musicOn=!musicOn;document.getElementById('btnMusic').textContent=musicOn?'🔊 音乐':'🔇 静音';if(musicOn){playTone(440,0.1,'sine',0.05);}}

function setDiff(d){
  curDiff=d;document.querySelectorAll('.diff-tab').forEach(function(t,i){t.classList.toggle('active',i+1===d);});
  fQ=sf(QALL.filter(function(q){return q.d===d;}));tr=fQ.length;document.getElementById('tr').textContent=tr;restartGame();
}

function startGame(){
  initAudio();document.getElementById('btnStart').style.display='none';
  fQ=sf(QALL.filter(function(q){return q.d===curDiff;}));tr=fQ.length;document.getElementById('tr').textContent=tr;
  go=true;sc=[0,0];cr=0;ans=[false,false];
  document.getElementById('s1').textContent='0';document.getElementById('s2').textContent='0';
  document.getElementById('winOverlay').classList.remove('show');nextRound();
}

function nextRound(){
  if(cr>=tr){endGame();return;}ans=[false,false];document.getElementById('rn').textContent=cr+1;
  var q=fQ[cr];renderPlayer(1,q);renderPlayer(2,q);
  tm=15;document.getElementById('tm').textContent=tm;clearInterval(ti);
  ti=setInterval(function(){tm--;document.getElementById('tm').textContent=tm;if(tm<=5)sfxTick();if(tm<=0){clearInterval(ti);timeUp();}},1000);
}

function renderPlayer(pn,q){
  var qText=q.q,opts=q.o,ansIdx=q.a;
  document.getElementById('q'+pn).textContent='第'+(cr+1)+'题：'+qText;
  var ix=[0,1,2,3];for(var i=ix.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ix[i];ix[i]=ix[j];ix[j]=t;}
  var lb=['A','B','C','D'],h='';
  for(var i=0;i<4;i++){var oi=ix[i];h+='<button class="p-opt" onclick="answer('+pn+','+oi+','+ansIdx+',this)" id="ob'+pn+'_'+i+'">'+lb[i]+'. '+opts[oi]+'</button>';}
  document.getElementById('op'+pn).innerHTML=h;document.getElementById('fb'+pn).textContent='';document.getElementById('st'+pn).textContent='';
  document.getElementById('q'+pn).style.display='';document.getElementById('op'+pn).style.display='';
}

function answer(pn,oi,ai,btn){
  if(!go||ans[pn-1])return;ans[pn-1]=true;
  var bs=document.querySelectorAll('#op'+pn+' .p-opt');bs.forEach(function(b){b.disabled=true;});
  if(oi===ai){
    btn.classList.add('correct');sc[pn-1]+=10;document.getElementById('s'+pn).textContent=sc[pn-1];
    document.getElementById('fb'+pn).innerHTML='✅ 正确！+10';document.getElementById('st'+pn).textContent='🔥 连击！';sfxCorrect();
  }else{
    btn.classList.add('wrong');document.getElementById('fb'+pn).innerHTML='❌ 答错了';document.getElementById('st'+pn).textContent='';sfxWrong();
    for(var i=0;i<bs.length;i++){var lb=['A','B','C','D'];if(bs[i].textContent.indexOf(lb[ai]+'.')>=0)bs[i].classList.add('correct');}
  }
  if(ans[0]&&ans[1]){clearInterval(ti);cr++;setTimeout(function(){nextRound();},1200);}
}

function timeUp(){
  for(var p=1;p<=2;p++){if(!ans[p-1]){var bs=document.querySelectorAll('#op'+p+' .p-opt');bs.forEach(function(b){b.disabled=true;});document.getElementById('fb'+p).innerHTML='⏰ 时间到！';}}
  cr++;setTimeout(function(){nextRound();},1200);
}

function endGame(){
  go=false;clearInterval(ti);document.getElementById('winOverlay').classList.add('show');
  document.getElementById('ws1').textContent=sc[0];document.getElementById('ws2').textContent=sc[1];
  if(sc[0]>sc[1]){document.getElementById('winTitle').innerHTML='🔴 红方获胜！';document.getElementById('winTitle').style.color='#FF6B6B';document.getElementById('winSub').textContent='红方 '+sc[0]+' : '+sc[1]+' 蓝方';sfxWin();}
  else if(sc[1]>sc[0]){document.getElementById('winTitle').innerHTML='🔵 蓝方获胜！';document.getElementById('winTitle').style.color='#4ECDC4';document.getElementById('winSub').textContent='蓝方 '+sc[1]+' : '+sc[0]+' 红方';sfxWin();}
  else{document.getElementById('winTitle').innerHTML='🤝 平局！';document.getElementById('winTitle').style.color='#FFD700';document.getElementById('winSub').textContent='双方都是 '+sc[0]+' 分';playTone(523,0.3,'sine',0.08);}
  spawnConfetti();var best=parseInt(localStorage.getItem(sk)||'0');var mx=Math.max(sc[0],sc[1]);if(mx>best){localStorage.setItem(sk,mx);}
}

function spawnConfetti(){
  var colors=['#FF6B6B','#4ECDC4','#FFD700','#FF9800','#6C5CE7','#66BB6A','#EC407A','#42A5F5'];
  for(var i=0;i<60;i++){var d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'%';d.style.top=-(Math.random()*50+10)+'px';d.style.width=(Math.random()*10+6)+'px';d.style.height=(Math.random()*10+6)+'px';d.style.background=colors[Math.floor(Math.random()*colors.length)];d.style.animationDuration=(Math.random()*2+2)+'s';d.style.animationDelay=Math.random()*1.5+'s';d.style.borderRadius=Math.random()>0.5?'50%':'0';document.body.appendChild(d);setTimeout(function(){d.remove();},4000);}
}

function restartGame(){
  clearInterval(ti);go=false;sc=[0,0];cr=0;ans=[false,false];
  document.getElementById('s1').textContent='0';document.getElementById('s2').textContent='0';
  document.getElementById('q1').style.display='';document.getElementById('q2').style.display='';
  document.getElementById('op1').style.display='';document.getElementById('op2').style.display='';
  document.getElementById('fb1').textContent='';document.getElementById('fb2').textContent='';
  document.getElementById('st1').textContent='';document.getElementById('st2').textContent='';
  document.getElementById('rn').textContent='1';document.getElementById('tm').textContent='15';
  document.getElementById('winOverlay').classList.remove('show');document.getElementById('btnStart').style.display='inline-block';
  document.getElementById('q1').textContent='准备开始...';document.getElementById('q2').textContent='准备开始...';
  document.getElementById('op1').innerHTML='';document.getElementById('op2').innerHTML='';
  fQ=sf(QALL.filter(function(q){return q.d===curDiff;}));tr=fQ.length;document.getElementById('tr').textContent=tr;
  var cf=document.querySelectorAll('.confetti');cf.forEach(function(c){c.remove();});
}
